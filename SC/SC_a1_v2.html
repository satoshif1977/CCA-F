<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>科目A-1 本番想定 185問</title>
<style>
:root{
  --bg:#f0f4f8; --card:#ffffff; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b; --navy:#1e3a5f;
  --en-bg:#f8fafc; --en-border:#94a3b8;
  --ja-bg:#eff6ff; --ja-border:#3b82f6;
  --ok-bg:#ecfdf5; --ok-border:#10b981; --ok-text:#065f46;
  --ng-bg:#fef2f2; --ng-border:#ef4444; --ng-text:#991b1b;
  --exp-bg:#fffbeb; --exp-border:#f59e0b; --exp-label:#92400e; --exp-text:#3d1a00;
  --plus-bg:#f5f3ff; --plus-border:#8b5cf6; --plus-label:#5b21b6; --plus-text:#2e1065;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",
     "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
     background:var(--bg);color:var(--text);margin:0;line-height:1.75;overflow-wrap:anywhere}
.wrap{max-width:860px;margin:0 auto;padding:1.2rem 1rem 5rem}
.head h1{margin:0 0 .25rem;font-size:1.2rem;font-weight:700;line-height:1.35}
.head .sub{margin:0 0 .9rem;font-size:.78rem;color:var(--muted);line-height:1.6}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);
     padding:.6rem 0 .7rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.chips{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1.5px solid var(--border);color:var(--muted);
      border-radius:20px;padding:.38rem .8rem;font-size:.75rem;font-weight:700;
      cursor:pointer;font-family:inherit;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin-top:.5rem}
.tools button{background:var(--card);border:1px solid var(--border);color:var(--muted);
      border-radius:8px;padding:.5rem .3rem;font-size:.73rem;cursor:pointer;
      font-family:inherit;min-height:40px;line-height:1.3}
.tools button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem;
      margin-top:.5rem;font-size:.73rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score{font-weight:700;color:var(--navy)}
.card{background:var(--card);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:.9rem;
      box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid var(--border)}
.card.ok{background:#fbfdfc;border-color:#c7ebdd}
.qh{display:flex;align-items:center;gap:.45rem;margin-bottom:.7rem;flex-wrap:wrap}
.qn{background:var(--navy);color:#fff;padding:.2rem .6rem;border-radius:6px;
    font-weight:700;font-size:.78rem;letter-spacing:.03em}
.qc{padding:.16rem .55rem;border-radius:20px;border:1.5px solid var(--ja-border);
    color:var(--ja-border);font-size:.7rem;font-weight:700;white-space:nowrap}
.mk{margin-left:auto;font-weight:800;font-size:.85rem}
.qt{font-size:.94rem;line-height:1.78;padding:.7rem .85rem;margin:0 0 .7rem;
    background:var(--ja-bg);border-left:3px solid var(--ja-border);
    border-radius:0 6px 6px 0}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;
     background:var(--card);border:1.5px solid var(--border);border-radius:8px;
     padding:.6rem .8rem;font-size:.89rem;line-height:1.7;color:var(--text);
     cursor:pointer;font-family:inherit;transition:.12s;min-height:42px}
.opt:hover:not(:disabled){border-color:var(--ja-border);background:var(--ja-bg)}
.opt:disabled{cursor:default}
.opt .lb{font-weight:800;color:var(--muted);flex-shrink:0;min-width:1.3em}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-text)}
.opt.correct .lb{color:var(--ok-border)}
.opt.wrong{background:var(--ng-bg);border-color:var(--ng-border);color:var(--ng-text)}
.opt.wrong .lb{color:var(--ng-border)}
.ans{margin-top:.85rem}
.abbr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.76rem;line-height:1.65;margin:0 0 .55rem;padding:.5rem .85rem;
      background:var(--en-bg);border-left:3px solid var(--en-border);
      border-radius:0 6px 6px 0;color:var(--muted)}
.expl{background:var(--exp-bg);border-left:4px solid var(--exp-border);
      border-radius:0 8px 8px 0;padding:.8rem .95rem;margin-bottom:.5rem}
.el{font-size:.68rem;font-weight:800;color:var(--exp-label);letter-spacing:.06em;margin-bottom:.35rem}
.eb{font-size:.89rem;color:var(--exp-text);line-height:1.85;margin:0}
.plus{background:var(--plus-bg);border-left:4px solid var(--plus-border);
      border-radius:0 8px 8px 0;padding:.8rem .95rem}
.pl{font-size:.68rem;font-weight:800;color:var(--plus-label);letter-spacing:.06em;margin-bottom:.35rem}
.pb{font-size:.86rem;color:var(--plus-text);line-height:1.85;margin:0}
.foot{margin-top:1.6rem;font-size:.72rem;line-height:1.7;color:var(--muted);text-align:center}
@media (max-width:600px){
  .wrap{padding:.9rem .6rem 4rem}
  .head h1{font-size:1.02rem}
  .tools{grid-template-columns:repeat(3,1fr)}
  .card{padding:.85rem .85rem}
  .qt{padding:.6rem .7rem;font-size:.92rem}
  .opt{font-size:.87rem;padding:.55rem .7rem}
  .expl,.plus{padding:.7rem .75rem}
}
@media print{.bar{display:none}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>科目A-1 本番想定 185問</h1>
    <p class="sub">情報処理安全確保支援士試験 科目A-1（旧 午前I）／ 四肢択一 ／ 計算問題なし ／ IPA 公開の過去問 8回分（令和4年春〜令和7年秋・240問）を分析し、本番の出題枠順に構成</p>
  </div>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button id="showAns">答えを表示</button>
      <button id="wrongOnly">間違えた問題だけ</button>
      <button id="todo">未解答だけ</button>
      <button id="shuffle">順番シャッフル</button>
      <button id="reset">記録を消す</button>
    </div>
    <div class="meta"><span id="count"></span><span class="score" id="score"></span></div>
  </div>
  <div id="list"></div>
  <p class="foot">出典: IPA 公開の過去問題（午前Ⅰ 8回分・令和4年春〜令和7年秋）を分析して構成<br>
  試験要綱 Ver.5.6（2026年10月から適用）／ 出題範囲 科目A-1（共通知識・技術レベル3）</p>
</div>
<script>
const DATA = [{"cat": "問1-2 AI", "q": "AI における教師あり学習での交差検証に関する記述はどれか。", "opts": ["過学習を防ぐために、回帰モデルに複雑さを表すペナルティ項を加える", "複数の異なるアルゴリズムのモデルで学習し、結果を組み合わせて評価する", "単一のモデルで関連する複数の課題を学習し、課題間に共通する要因を獲得する", "データを複数のグループに分割し、一部を学習に残りを評価に使い、順に入れ替えて繰り返す"], "ans": 3, "abbr": "―", "note": "データを k 個に分け、1つを評価用、残りを学習用にする。評価用を順に入れ替えて k 回繰り返し、平均を取る。たまたま良い／悪い分け方だった、という偏りをなくせる。", "plus": "アの正則化＝複雑さにペナルティを与えて過学習を抑える。イのアンサンブル学習＝複数モデルの多数決。ウのマルチタスク学習＝複数課題を同時に学ぶ。4つとも別物として出る。"}, {"cat": "問1-2 AI", "q": "AI における機械学習の過程において、過学習と疑われたときの解消方法として最も適切なものはどれか。", "opts": ["訓練した時と同じ精度を出すために、訓練データをテストデータとして使用する", "精度を高めるために、元の訓練データに加工を施し、訓練データの量を増やす", "予測した結果に近づけるために、モデルをより複雑にする", "より多くの未知のデータに対して予測できるように、汎化性能を下げる"], "ans": 1, "abbr": "―", "note": "過学習＝訓練データを覚えすぎて、初見のデータに弱くなる状態。データを水増し（データ拡張）して種類を増やすと、丸暗記できなくなり汎化する。", "plus": "他の対策は 正則化、ドロップアウト、早期終了、モデルの単純化。逆に「モデルを複雑にする」「汎化性能を下げる」は過学習を悪化させるので、選択肢で出たら誤り。"}, {"cat": "問1-2 AI", "q": "2クラス分類モデルの評価に用いる ROC 曲線で使われる偽陽性率の説明として、最も適切なものはどれか。", "opts": ["“間違い”と予測したデータのうち、実際は“正しい”データの割合", "実際に“間違い”であるデータに対し、誤って“正しい”と予測したデータの割合", "実際に“間違い”であるデータに対し、正しく“間違い”と予測したデータの割合", "全データのうち、実際に正しく予測できなかったデータの割合"], "ans": 0, "abbr": "ROC = Receiver Operating Characteristic", "note": "偽陽性＝本当は陰性なのに「陽性」と判定したもの。ROC 曲線は 横軸に偽陽性率、縦軸に真陽性率を取り、しきい値を動かしたときの描く線。", "plus": "混同行列の4区分 ── 真陽性(TP)・偽陽性(FP)・真陰性(TN)・偽陰性(FN)。適合率＝TP÷(TP+FP)、再現率＝TP÷(TP+FN)、F値＝その調和平均。AUC は ROC 曲線の下の面積で、1に近いほど良い。"}, {"cat": "問1-2 AI", "q": "クラウドで学習し、エッジデバイスで推論する機械学習ベースのエッジ AI において、エッジデバイスで行われる推論処理として適切なものはどれか。", "opts": ["一定の環境の中で試行錯誤を行い、行動に報酬を与えることで学習するプロセス", "学習したモデルに従い、実際にデータの識別などを行うプロセス", "識別などを行うためのモデルを、正解のラベルを付けたデータによって作成するプロセス", "識別などを行うためのモデルを、正解のラベルを付けないデータによって作成するプロセス"], "ans": 1, "abbr": "―", "note": "学習＝モデルを作る作業、推論＝できたモデルを使って判定する作業。エッジ AI は「作るのはクラウド、使うのは手元」という分担。通信が要らず、応答が速い。", "plus": "アは強化学習、ウは教師あり学習、エは教師なし学習。学習の3分類と「学習／推論」の区別は、別の軸として整理しておく。"}, {"cat": "問1-2 AI", "q": "著作権法及び関連法令によれば、生成 AI を利用して画像を生成する行為又はその生成物の利用が著作権侵害にあたるか否かに関して、適切な記述はどれか。", "opts": ["AI が既存の著作物を学習している場合は、生成すると、いかなる場合も著作権侵害になる", "生成した画像が既存の著作物と類似しており、それを公開した場合、著作権侵害となる可能性がある", "AI が自動的に創作したものであるため、いかなる状況でも著作権の対象外となる", "生成した本人の私的使用に限って利用が認められ、商業利用は いかなる場合も著作権侵害となる"], "ans": 1, "abbr": "―", "note": "学習の段階は 著作権法30条の4 で原則認められる。問題になるのは 生成物が既存の著作物に似ていて、それを使ったとき。「類似性」と「依拠性」の2つが揃うと侵害になりうる。", "plus": "「いかなる場合も」「常に」という断定の選択肢は、法律問題ではほぼ誤り。条件付きで述べている選択肢を選ぶのが定石。"}, {"cat": "問1-2 AI", "q": "ディープラーニングにおいて、層を深くしたときに勾配が小さくなり学習が進まなくなる問題はどれか。", "opts": ["勾配消失問題", "次元の呪い", "局所最適解", "コールドスタート問題"], "ans": 0, "abbr": "―", "note": "誤差を前の層へ伝える際、掛け算が繰り返されて値が 0 に近づく。深い層ほど学習が進まない。活性化関数を ReLU にする、残差接続（ResNet）を入れる、などで回避する。", "plus": "次元の呪い＝特徴量が多すぎてデータが疎になる。局所最適解＝全体の最小ではない谷にはまる。コールドスタート＝推薦システムで履歴がない利用者に推薦できない。"}, {"cat": "問1-2 AI", "q": "画像認識で広く使われ、フィルタを用いて局所的な特徴を抽出するニューラルネットワークはどれか。", "opts": ["CNN", "RNN", "GAN", "オートエンコーダ"], "ans": 0, "abbr": "CNN = Convolutional Neural Network（畳み込みニューラルネットワーク）", "note": "小さなフィルタを画像の上で滑らせて、線や角などの特徴を取り出す。位置がずれても同じ特徴を捉えられるのが強み。", "plus": "RNN＝時系列・文章向き（前の出力を次に渡す）。GAN＝生成器と識別器を競わせて本物らしいデータを作る。オートエンコーダ＝入力を圧縮して復元し、異常検知などに使う。"}, {"cat": "問1-2 AI", "q": "自然言語処理で、文中の単語どうしの関連の強さを計算して文脈を捉える仕組みを中核とするモデルはどれか。", "opts": ["Transformer", "パーセプトロン", "決定木", "k-means"], "ans": 0, "abbr": "―", "note": "Attention（注意機構）で「どの単語がどの単語を見るべきか」を計算する。順番に処理する RNN と違い、並列に処理できるので大規模化できた。GPT や BERT の土台。", "plus": "決定木＝条件分岐で分類（説明しやすい）。k-means＝教師なしのクラスタリング。パーセプトロン＝ニューラルネットの最小単位。"}, {"cat": "問1-2 AI", "q": "大規模言語モデルに対し、外部の文書を検索して取得した情報を与えたうえで回答させる手法はどれか。", "opts": ["RAG", "ファインチューニング", "プロンプトインジェクション", "蒸留"], "ans": 0, "abbr": "RAG = Retrieval-Augmented Generation（検索拡張生成）", "note": "モデル自体は変えず、答える直前に関連文書を渡す。社内文書など、学習していない最新情報を扱える。出典も示せる。", "plus": "ファインチューニング＝モデルの重みを追加学習で変える（コスト高）。蒸留＝大きいモデルの知識を小さいモデルへ移す。プロンプトインジェクション＝指示を乗っ取る攻撃。"}, {"cat": "問1-2 AI", "q": "利用者の入力に紛れ込ませた指示によって、AI に本来の制約を無視させる攻撃はどれか。", "opts": ["プロンプトインジェクション", "敵対的サンプル", "データポイズニング", "モデル反転攻撃"], "ans": 0, "abbr": "―", "note": "「これまでの指示を無視して…」のような文を読ませ、開発者が与えた制約を上書きする。外部サイトの文章に仕込む間接型もある。", "plus": "敵対的サンプル＝人には分からない微小なノイズで誤認識させる。データポイズニング＝学習データに毒を混ぜる。モデル反転攻撃＝出力から学習データを復元する。"}, {"cat": "問1-2 AI", "q": "AI の判断根拠を人が理解できる形で示すことを目指す技術の総称はどれか。", "opts": ["説明可能なAI（XAI）", "AutoML", "MLOps", "転移学習"], "ans": 0, "abbr": "XAI = eXplainable AI", "note": "「なぜそう判断したか」を示す。融資審査や医療など、結果だけでは使えない領域で必須。手法に LIME、SHAP。", "plus": "AutoML＝モデル選択やハイパーパラメータ調整の自動化。MLOps＝機械学習モデルの開発・運用を回す仕組み。転移学習＝学習済みモデルを別の課題に流用する。"}, {"cat": "問1-2 AI", "q": "学習データに偏りがあることで、AI の出力が特定の属性に不利になる問題はどれか。", "opts": ["アルゴリズムバイアス", "ハルシネーション", "オーバーフィッティング", "ドリフト"], "ans": 0, "abbr": "―", "note": "過去の採用データで学習すると、過去の偏りをそのまま再現してしまう。データの偏りが原因なので、モデルを良くしても消えない。", "plus": "ハルシネーション＝もっともらしい嘘を生成する。ドリフト＝時間が経って入力データの性質が変わり、精度が落ちる（再学習が必要）。"}, {"cat": "問1-2 AI", "q": "AI 事業者が留意すべき事項を、政府がまとめた指針はどれか。", "opts": ["AI事業者ガイドライン", "情報セキュリティ管理基準", "システム管理基準", "DX推進ガイドライン"], "ans": 0, "abbr": "―", "note": "総務省・経済産業省が2024年に公表。開発者・提供者・利用者それぞれの立場で、安全性・公平性・透明性などの指針を示す。", "plus": "国際的には EU の AI 法（リスクベースで4段階に分類）、NIST の AI リスクマネジメントフレームワーク。いずれも「リスクに応じた規律」という考え方。"}, {"cat": "問1-2 AI", "q": "待ち行列理論の M/M/1 モデルにおいて、利用率が高くなるにつれて平均待ち時間はどのように変化するか。", "opts": ["利用率に比例して増える", "利用率が1に近づくと急激に増える", "利用率によらず一定である", "利用率が高いほど短くなる"], "ans": 1, "abbr": "―", "note": "平均待ち時間 = 平均サービス時間 × ρ ÷ (1−ρ)。ρ が 0.9 を超えると分母が小さくなり、爆発的に伸びる。サーバのCPU使用率を上げすぎない理由がこれ。", "plus": "記法は「到着/サービス/窓口数」。M は Markov（ランダム）、D は Deterministic（一定）。M/M/1 は 8回中2回出題（R7秋問1・R6春問1）の頻出枠。"}, {"cat": "問1-2 AI", "q": "量子ゲート方式の量子コンピュータの説明として、適切なものはどれか。", "opts": ["演算は2進数で行われ、結果も2進数で出力される", "特定のアルゴリズムによる演算だけができ、加算演算はできない", "複数の状態を同時に表現する量子ビットと、その重ね合わせを利用する", "量子状態を変化させながら観測するので、100℃以上の高温で動作する"], "ans": 2, "abbr": "―", "note": "量子ビットは 0 と 1 の両方を同時に持てる（重ね合わせ）。n ビットあれば 2^n 通りを一度に扱える。極低温で動作させる必要がある。", "plus": "量子ゲート方式＝汎用（任意の計算ができる）。量子アニーリング方式＝組合せ最適化に特化。結果は確率的なので、何度も実行して多数決を取る。"}, {"cat": "問1-2 AI", "q": "情報量の単位であるエントロピーが最大になるのは、どのような場合か。", "opts": ["すべての事象の発生確率が等しいとき", "1つの事象の発生確率が1のとき", "事象の種類が最も少ないとき", "事象が互いに従属しているとき"], "ans": 0, "abbr": "―", "note": "エントロピー＝「予測しにくさ」。コイン投げで表裏が半々のときが最も予測できず、情報量が最大。片方に偏るほど予測しやすく、情報量は減る。", "plus": "圧縮の限界を示すのがシャノンの情報源符号化定理。偏りが大きいデータほどよく圧縮できるのは、エントロピーが小さいから。"}, {"cat": "問1-2 AI", "q": "複数の弱い学習器を順番に学習させ、前の学習器が誤った事例を重点的に学ばせる手法はどれか。", "opts": ["ブースティング", "バギング", "スタッキング", "交差検証"], "ans": 0, "abbr": "―", "note": "間違えた問題を重点的にやり直す、人間の勉強と同じ発想。代表が XGBoost、LightGBM。精度は高いが過学習しやすい。", "plus": "バギング＝独立に学習させて多数決（ランダムフォレスト）。スタッキング＝複数モデルの出力を別のモデルで統合。3つともアンサンブル学習の種類。"}, {"cat": "問1-2 AI", "q": "教師なし学習に分類される手法はどれか。", "opts": ["クラスタリング", "回帰分析", "分類（ロジスティック回帰）", "強化学習"], "ans": 0, "abbr": "―", "note": "正解ラベルを与えず、データの似たもの同士をまとめる。顧客のセグメント分けなどに使う。代表が k-means、階層的クラスタリング。", "plus": "教師あり＝正解ラベルあり（分類・回帰）。教師なし＝ラベルなし（クラスタリング・次元削減）。強化学習＝報酬で学ぶ。3分類で整理する。"}, {"cat": "問1-2 AI", "q": "音声や画像から特徴を抽出する前処理として、データの尺度をそろえる操作はどれか。", "opts": ["正規化（スケーリング）", "正則化", "次元削減", "ラベリング"], "ans": 0, "abbr": "―", "note": "身長(cm)と体重(kg)のように単位が違うと、大きい数の項目だけが効いてしまう。0〜1 などに揃えて公平にする。", "plus": "正則化（regularization）はモデルの複雑さを抑える別物。名前が似ているので試験では必ず引っかけに使われる。次元削減は 主成分分析（PCA）が代表。"}, {"cat": "問1-2 AI", "q": "AI の学習や推論に用いる計算資源のうち、同種の演算を大量に並列実行することに適したものはどれか。", "opts": ["GPU", "CPU", "FPGA", "ASIC"], "ans": 0, "abbr": "GPU = Graphics Processing Unit", "note": "多数の単純なコアで同じ計算を一斉に行う。行列演算の塊である機械学習に向く。逐次の複雑な処理は CPU が速い。", "plus": "FPGA＝書き換え可能で、特定処理を高速化。ASIC＝専用に焼いた回路（Google の TPU など）。速度と柔軟性は反比例する。"}, {"cat": "問3-7 基礎", "q": "自然数をキーとするデータをハッシュ表で管理する。ハッシュ関数 h(x) = x mod n のとき、キー a と b が衝突する条件はどれか。", "opts": ["a+b が n の倍数", "a−b が n の倍数", "n が a+b の倍数", "n が a−b の倍数"], "ans": 1, "abbr": "―", "note": "衝突＝ a mod n と b mod n が等しい。つまり a と b を n で割った余りが同じ。これは a−b が n で割り切れることと同じ意味。", "plus": "8回中2回出題（R6秋問3・R4秋問3）。衝突の解決法は チェイン法（連結リストでつなぐ）と オープンアドレス法（空きを探す）。"}, {"cat": "問3-7 基礎", "q": "データ構造のうち、最後に入れたものを最初に取り出す方式はどれか。", "opts": ["キュー", "スタック", "双方向リスト", "ヒープ"], "ans": 1, "abbr": "LIFO = Last In First Out", "note": "積み重ねた皿と同じ。関数の呼び出し履歴（コールスタック）、逆ポーランド記法の計算、深さ優先探索に使う。", "plus": "キューは FIFO（先入れ先出し）で、印刷待ち行列や幅優先探索。ヒープは最大値／最小値を素早く取り出す木構造で、優先度付きキューの実装に使う。"}, {"cat": "問3-7 基礎", "q": "式 A+B×C の逆ポーランド表記法（後置記法）による表現はどれか。", "opts": ["+×CBA", "×+ABC", "ABC×+", "CBA+×"], "ans": 2, "abbr": "―", "note": "演算子を後ろに書く。A+B×C は ×が先なので BC× を作り、それと A を + で結ぶ → ABC×+。スタックで左から処理でき、括弧が不要になる。", "plus": "前置記法（ポーランド記法）は +A×BC。中置記法が普通の書き方。コンパイラが式を評価する際に後置記法へ変換する。"}, {"cat": "問3-7 基礎", "q": "整列アルゴリズムのうち、平均計算量が O(n log n) で、最悪の場合は O(n²) となるものはどれか。", "opts": ["クイックソート", "マージソート", "ヒープソート", "バブルソート"], "ans": 0, "abbr": "―", "note": "基準値で2つに分けて再帰する。分割が偏ると（すでに整列済みなど）片側だけが長くなり O(n²) まで落ちる。基準値の選び方で回避する。", "plus": "マージソートとヒープソートは最悪でも O(n log n)。バブル・選択・挿入は O(n²)。安定ソート（同じ値の順序が保たれる）は 挿入・マージ・バブル。"}, {"cat": "問3-7 基礎", "q": "同時に実行可能な複数の動作を、コンパイルの段階でまとめて一つの複合命令とし、高速化を図る方式はどれか。", "opts": ["CISC", "MIMD", "RISC", "VLIW"], "ans": 3, "abbr": "VLIW = Very Long Instruction Word", "note": "どの命令を並列にできるかを、実行時ではなくコンパイル時に決めておく。CPU 側の判断回路が要らないので単純になる。", "plus": "スーパスカラ＝実行時にCPUが並列化を判断する。RISC＝命令を単純化。CISC＝複雑な命令を持つ。MIMD＝複数データに複数命令（並列処理の分類）。"}, {"cat": "問3-7 基礎", "q": "キャッシュメモリのアクセス時間が主記憶の 1/30 で、ヒット率が 95% のとき、実効メモリアクセス時間は主記憶のアクセス時間の約何倍になるか。", "opts": ["0.03", "0.08", "0.37", "0.95"], "ans": 1, "abbr": "―", "note": "実効時間 = ヒット率×キャッシュ時間 + (1−ヒット率)×主記憶時間 = 0.95×(1/30) + 0.05×1 ≒ 0.032 + 0.05 = 0.082。", "plus": "ヒット率が少し下がるだけで実効時間は大きく悪化する。書き込み方式は ライトスルー（都度主記憶へ）と ライトバック（追い出すときに書く）。"}, {"cat": "問3-7 基礎", "q": "キャッシュメモリの置換アルゴリズムのうち、参照回数が最も少ないブロックを置換対象とするものはどれか。", "opts": ["FIFO", "LFU", "LIFO", "LRU"], "ans": 1, "abbr": "LFU = Least Frequently Used ／ LRU = Least Recently Used", "note": "LFU は「使われた回数」が少ないものを追い出す。LRU は「最後に使われてからの時間」が長いものを追い出す。基準が 回数 か 時刻 かの違い。", "plus": "FIFO＝入れた順。LIFO＝最後に入れたものから。問題文に「参照回数」とあれば LFU、「最終参照時刻」とあれば LRU。表が出たら両方の列を確認する。"}, {"cat": "問3-7 基礎", "q": "コンテナ型仮想化の説明として、適切なものはどれか。", "opts": ["物理サーバと物理サーバの仮想環境とが OS を共有するので、どちらかに OS をもてばよい", "物理サーバにホスト OS をもたず、仮想化ソフトウェアによって個別のゲスト OS をもった仮想サーバを動作させる", "ホスト OS と仮想化ソフトウェアによってプログラムの実行環境を仮想化するので、仮想サーバに個別のゲスト OS をもたない", "ホスト OS にインストールした仮想化ソフトウェアによって、個別のゲスト OS をもった仮想サーバを動作させる"], "ans": 2, "abbr": "―", "note": "コンテナはカーネルをホストと共有し、アプリと依存ライブラリだけを包む。ゲスト OS がないので起動が速く、イメージが小さい。", "plus": "イはハイパバイザ型（タイプ1・ベアメタル）、エはホスト OS 型（タイプ2）。分離の強さは 仮想マシン > コンテナ、軽さは逆。"}, {"cat": "問3-7 基礎", "q": "二つのタスクが共用する二つの資源を排他的に使用するとき、デッドロックの発生を防ぐ方法はどれか。", "opts": ["一方のタスクの優先度を高くする", "資源獲得の順序を両方のタスクで同じにする", "資源獲得の順序を両方のタスクで逆にする", "両方のタスクの優先度を同じにする"], "ans": 1, "abbr": "―", "note": "デッドロックは「AがBを待ち、BがAを待つ」循環で起きる。全員が同じ順序で取れば循環が作れない。4条件のうち「循環待ち」を崩す方法。", "plus": "4条件は 相互排除・保持と待機・横取り不可・循環待ち。1つでも崩せば起きない。8回中2回出題（R6春問6・R4秋問6）。"}, {"cat": "問3-7 基礎", "q": "仮想記憶方式において、セグメンテーション方式と比較した場合のページング方式の長所はどれか。", "opts": ["記憶領域へのアクセス保護を論理的な単位で行うことができる", "記憶領域をプログラム間で容易に共用することができる", "実行時に記憶領域の大きさを動的に変えることができる", "主記憶の外部断片化が発生しない"], "ans": 3, "abbr": "―", "note": "ページングは固定長で区切るので、空きが細切れになっても必ず使える（外部断片化が起きない）。セグメンテーションは可変長なので、隙間が生じる。", "plus": "ページング＝固定長・外部断片化なし・内部断片化あり。セグメンテーション＝可変長・論理単位で保護や共用がしやすい。長所が逆になっている。"}, {"cat": "問3-7 基礎", "q": "ページング方式で、ページの置換えが頻発して処理がほとんど進まなくなる状態はどれか。", "opts": ["スラッシング", "デッドロック", "フラグメンテーション", "スタベーション"], "ans": 0, "abbr": "―", "note": "多重度を上げすぎると、ページの入替えばかりで仕事が進まない。CPU 使用率は低いのに遅い、という症状になる。", "plus": "対策は 主記憶の増設、多重プログラミング度の抑制、ワーキングセット（当面必要なページ集合）を主記憶に載せること。スタベーションは優先度が低いタスクが永久に実行されない状態。"}, {"cat": "問3-7 基礎", "q": "手続型言語のコンパイラがコード生成までに行う処理のうち、最後に行うものはどれか。", "opts": ["意味解析", "構文解析", "最適化", "字句解析"], "ans": 2, "abbr": "―", "note": "字句解析（単語に分ける）→ 構文解析（文法構造を作る）→ 意味解析（型の整合などを確認）→ 最適化 → コード生成。最適化が最後。", "plus": "インタプリタは1行ずつ翻訳しながら実行。JIT コンパイラは実行時に機械語へ変換し、両者の良いとこ取り。リンカは複数のオブジェクトを結合する。"}, {"cat": "問3-7 基礎", "q": "プログラムの実行中に別のプロセスから呼び出されても、正しく動作する性質をもつプログラムはどれか。", "opts": ["リエントラント（再入可能）", "リユーザブル（再使用可能）", "リカーシブ（再帰的）", "リロケータブル（再配置可能）"], "ans": 0, "abbr": "―", "note": "処理の途中で割り込まれて別のプロセスから呼ばれても壊れない。実行中に変化するデータを共有領域に置かないことが条件。", "plus": "リユーザブル＝終わってから再度呼べる。リカーシブ＝自分自身を呼べる。リロケータブル＝どのアドレスに置いても動く。4つセットで必ず出る。"}, {"cat": "問3-7 基礎", "q": "システムの信頼性設計に関する記述のうち、適切なものはどれか。", "opts": ["フェールセーフとは、利用者の誤操作によってシステムが異常終了しないようにする設計方法である", "フェールソフトとは、故障が発生した場合でも機能を縮退させることなく稼働を継続する概念である", "フォールトアボイダンスとは、構成要素の個々の品質を高めて故障が発生しないようにする概念である", "フォールトトレランスとは、故障が生じても安全状態に固定し、全体として安全が維持される設計方法である"], "ans": 2, "abbr": "―", "note": "フォールトアボイダンス＝そもそも壊れないようにする（品質を上げる）。対になるのがフォールトトレランス＝壊れても動き続ける（冗長化する）。", "plus": "アの内容はフールプルーフ。イの「縮退させることなく」は誤りで、フェールソフトは縮退してでも動かす。エの内容はフェールセーフ。4つを入れ替えた典型的な引っかけ。"}, {"cat": "問3-7 基礎", "q": "二つのシステム A、B の稼働率が等しいとき、常に成り立つ関係はどれか。", "opts": ["MTBF が等しく、かつ MTTR が等しい", "MTTR / MTBF が等しい", "MTBF が大きいほど MTTR も大きい", "MTTR が等しければ MTBF も等しい"], "ans": 1, "abbr": "MTBF = Mean Time Between Failures ／ MTTR = Mean Time To Repair", "note": "稼働率 = MTBF ÷ (MTBF + MTTR)。分母分子を MTBF で割ると 1 ÷ (1 + MTTR/MTBF)。つまり稼働率は MTTR/MTBF の比だけで決まる。", "plus": "稼働率が同じでも、MTBF 1000時間・MTTR 10時間 と MTBF 100時間・MTTR 1時間 は同じ。前者は滅多に壊れないが直るのに時間がかかる、という違いがある。"}, {"cat": "問3-7 基礎", "q": "3台以上のディスクにデータとパリティを分散して書き込み、1台の故障に耐えられる RAID レベルはどれか。", "opts": ["RAID0", "RAID1", "RAID5", "RAID6"], "ans": 2, "abbr": "RAID = Redundant Arrays of Inexpensive Disks", "note": "パリティ（誤り訂正用のデータ）を全台に分散する。1台壊れても残りから計算して復元できる。容量効率がよい。", "plus": "必要台数／耐えられる故障台数 ── RAID0:2台〜/0台、RAID1:2台/1台、RAID5:3台〜/1台、RAID6:4台〜/2台。RAID1+0 は性能と冗長性を両立。"}, {"cat": "問3-7 基礎", "q": "入力 X と Y の値が同じときにだけ出力 Z に 1 を出力する回路はどれか。", "opts": ["XNOR（一致回路）", "XOR", "AND", "NOR"], "ans": 0, "abbr": "―", "note": "XNOR は XOR の否定。X と Y が同じ（0,0 または 1,1）のとき 1 になるので「一致回路」と呼ぶ。比較回路の基本。", "plus": "XOR は違うときに 1（不一致検出・加算器の桁計算）。NAND と NOR はそれぞれ単独で全論理回路を構成できる（完全系）。"}, {"cat": "問3-7 基礎", "q": "IoT を支える技術の一つであるエネルギーハーベスティングを説明したものはどれか。", "opts": ["IoT デバイスのエネルギー使用量や稼働状況を把握して、電力使用の最適化を図る技術", "周囲の環境から振動、熱、光、電磁波などの微小なエネルギーを集めて電力に変換し、IoT デバイスに供給する技術", "カテゴリ5以上の LAN ケーブルによって、IoT デバイスに電力を供給する技術", "必要な時だけデバイスの電源を ON にして通信を行うことによって、省電力化を図る技術"], "ans": 1, "abbr": "―", "note": "harvest＝収穫。身の回りに捨てられているわずかなエネルギーを拾い集めて使う。電池交換が不要になるので、大量のセンサーを置く用途に向く。", "plus": "ウは PoE（Power over Ethernet）。エは間欠動作。IoT の省電力技術として3つセットで出題されやすい。LPWA（低消費電力・広域通信）も関連語。"}, {"cat": "問8-10 DB", "q": "ACID 特性の四つの性質に含まれないものはどれか。", "opts": ["一貫性", "可用性", "原子性", "耐久性"], "ans": 1, "abbr": "ACID = Atomicity / Consistency / Isolation / Durability", "note": "原子性・一貫性・独立性・耐久性の4つ。可用性（Availability）は入らない。頭文字の A は Atomicity（原子性）であって Availability ではない。", "plus": "8回中1回出題（R4秋問10）。分散DBでACIDを緩めたのが BASE（Basically Available・Soft state・Eventual consistency）。CAP定理とセットで出る。"}, {"cat": "問8-10 DB", "q": "BASE 特性を満たす NoSQL データベースシステムに関する記述のうち、適切なものはどれか。", "opts": ["クライアントからの更新要求を2相コミットによって全てのノードに反映する", "データの更新結果は、システムに障害がなければ、いつかは全てのノードに反映される", "同一の主キーの値による同時の参照要求に対し、全てのノードは同じ結果を返す", "ノード間のネットワークが分断されると、クライアントからの処理要求を受け付けなくなる"], "ans": 1, "abbr": "BASE = Basically Available / Soft state / Eventual consistency", "note": "「結果整合性」＝今すぐ全ノードが一致していなくてよいが、いずれ揃う。一致を待たないので可用性と性能が上がる。", "plus": "アの2相コミットは ACID 側の考え方。ウは強整合性。エは可用性を捨てている。CAP定理では BASE は AP（可用性＋分断耐性）寄り。"}, {"cat": "問8-10 DB", "q": "関係を第2正規形から第3正規形に変換する手順はどれか。", "opts": ["候補キー以外の属性から、候補キーの一部の属性に対して関数従属性がある場合、その関係を分解する", "候補キー以外の属性間に関数従属性がある場合、その関係を分解する", "候補キーの一部の属性から、候補キー以外の属性への関数従属性がある場合、その関係を分解する", "一つの属性に複数の値が入っている場合、単一の値になるように分解する"], "ans": 1, "abbr": "―", "note": "第3正規形＝「キー以外がキー以外を決めている」関係（推移的関数従属）を取り除く。社員番号→部署コード→部署名 なら、部署コードと部署名を別表に分ける。", "plus": "第1＝繰返しをなくす（エ）。第2＝部分関数従属をなくす（ウ）。第3＝推移的関数従属をなくす（イ）。アは誤りの記述。4択の並びがそのまま正規化の段階になっている。"}, {"cat": "問8-10 DB", "q": "関係データベースのビューに関する記述のうち、適切なものはどれか。", "opts": ["ビューの列名は、基の表の列名と異なる名称で定義することができる", "ビューは、基の表から指定した列を抜き出すように定義するものであり、行を抜き出すように定義することはできない", "二つ以上の表の結合によって定義されたビューは、結合の仕方によらず更新操作ができる", "和両立な二つの表に対し、和集合演算を用いてビューを定義することはできない"], "ans": 0, "abbr": "―", "note": "ビューは SELECT 文に名前を付けたもの。列に別名（AS）を付けられる。行の絞り込み（WHERE）も、結合も、和集合も定義できる。", "plus": "更新できるビューには制限があり、集計や結合を含むと更新できないことが多い（ウが誤りの理由）。実データを持たせたものがマテリアライズドビュー。"}, {"cat": "問8-10 DB", "q": "チェックポイントを取得する DBMS において、システム障害発生後の再立上げ時に、ロールフォワード（前進復帰）によって回復できるトランザクションはどれか。", "opts": ["チェックポイント前に開始し、障害発生前にコミットしたもの", "チェックポイント前に開始し、コミットしていないもの", "チェックポイント後に開始し、コミットしていないもの", "チェックポイント前に開始し、チェックポイント前にコミットしたもの"], "ans": 0, "abbr": "―", "note": "コミット済み＝「やると決まった」のでロールフォワードで進める。未コミット＝ロールバックで戻す。チェックポイント前にコミット済みのものは既に書き出されているので対象外。", "plus": "8回中2回出題（R5秋問9・R4秋問9）。図を見て判断する形式。コミットの黒丸があるかどうか、チェックポイントより後かどうかの2軸で切る。"}, {"cat": "問8-10 DB", "q": "SQL 文の参照制約で、親表の行を削除したときに、それを参照する子表の行も自動的に削除する指定はどれか。", "opts": ["CASCADE", "RESTRICT", "SET DEFAULT", "SET NULL"], "ans": 0, "abbr": "―", "note": "ON DELETE CASCADE＝連鎖削除。親が消えれば子も消える。意図しない大量削除が起きうるので、設計時に慎重に決める。", "plus": "RESTRICT／NO ACTION＝参照されていれば削除を拒否。SET NULL＝子の外部キーを NULL にする。SET DEFAULT＝既定値にする。4つの挙動の違いが問われる。"}, {"cat": "問8-10 DB", "q": "ストアドプロシージャの利点はどれか。", "opts": ["アプリケーションからネットワークを介して DBMS にアクセスする場合、両者間の通信量を減少させる", "一連の要求を一括処理することによって、DBMS 内の実行計画の数を減少させる", "一連の要求を一括処理することによって、DBMS 内の必要バッファ数を減少させる", "データが格納されているディスク装置への I/O 回数を減少させる"], "ans": 0, "abbr": "―", "note": "処理をサーバ側に置き、呼び出しだけを送る。何度も SQL を往復させないので、ネットワークの通信量が減る。", "plus": "8回中1回出題（R6春問9）。関連語にトリガ（イベントで自動実行）、ユーザ定義関数。性能面の利点は「通信量」であって、I-O回数ではない点が引っかけ。"}, {"cat": "問8-10 DB", "q": "データ管理者（DA）とデータベース管理者（DBA）を別々に任命した場合の、DA の役割として適切なものはどれか。", "opts": ["業務データ量の増加傾向を把握し、ディスク装置の増設などを計画する", "設計工程では主に論理データベース設計を行い、データ項目を管理して標準化する", "テスト工程では主にパフォーマンスチューニングを担当する", "システム障害が発生した場合に、データの復旧や整合性のチェックを行う"], "ans": 1, "abbr": "DA = Data Administrator ／ DBA = Database Administrator", "note": "DA は「データそのもの」の責任者。意味・名称・標準を決める。DBA は「動かす」責任者で、容量・性能・障害対応を見る。", "plus": "8回中1回出題（R4春問21）。ア・ウ・エはすべて DBA の役割。論理設計と標準化が DA、物理設計と運用が DBA と覚える。"}, {"cat": "問8-10 DB", "q": "データベースの障害回復において、媒体障害（ディスク故障）からの復旧手順として適切なものはどれか。", "opts": ["バックアップを復元し、更新後ログでロールフォワードする", "更新前ログでロールバックする", "再起動するだけで自動的に復旧する", "チェックポイントまで戻す"], "ans": 0, "abbr": "―", "note": "ディスクが壊れているので、まずバックアップから戻す。そのあと、バックアップ取得後の更新をログで再現して最新に近づける。", "plus": "トランザクション障害＝ロールバック。システム障害（電源断）＝再起動時にログで自動復旧。媒体障害＝バックアップ＋ロールフォワード。3つを障害種別で切り分ける。"}, {"cat": "問8-10 DB", "q": "二つのトランザクションが互いに相手のロックの解放を待ち、処理が進まなくなる状態を DBMS が検出したときの一般的な処置はどれか。", "opts": ["一方のトランザクションをロールバックする", "両方のトランザクションをコミットする", "ロックを解放して処理を続行する", "DBMS を再起動する"], "ans": 0, "abbr": "―", "note": "どちらかを犠牲にして止め、もう一方を進める。犠牲になったほうはアプリ側で再実行する。被害が小さいほうを選ぶ実装が多い。", "plus": "アプリ側の予防策は 資源の取得順序を全体で統一する、トランザクションを短く保つ。ロックの粒度は 表 > ページ > 行 で、細かいほど同時実行性が上がる。"}, {"cat": "問8-10 DB", "q": "コミットされていないデータを他のトランザクションが読んでしまう現象はどれか。", "opts": ["ダーティリード", "ノンリピータブルリード", "ファントムリード", "ロストアップデート"], "ans": 0, "abbr": "―", "note": "まだ確定していない値を読む。あとでロールバックされると、読んだ値は存在しなかったことになる。最も分離レベルが低い READ UNCOMMITTED で起きる。", "plus": "ノンリピータブルリード＝同じ行を2回読んだら値が変わっていた。ファントムリード＝2回目に行数が増えていた。分離レベルを上げるほど防げるが遅くなる。"}, {"cat": "問8-10 DB", "q": "静止画の圧縮方式のうち、非可逆圧縮で写真に適しているものはどれか。", "opts": ["GIF", "JPEG", "PNG", "BMP"], "ans": 1, "abbr": "JPEG = Joint Photographic Experts Group", "note": "非可逆＝元には戻らないが小さくなる。色の変化がなだらかな写真に向く。文字や線画に使うと輪郭がにじむ。", "plus": "PNG は可逆で、図やスクリーンショット向き。GIF は256色でアニメ可。近年は WebP・AVIF が両対応で高圧縮。"}, {"cat": "問8-10 DB", "q": "W3C で仕様が定義され、矩形や円、直線、文字列などの図形オブジェクトを XML 形式で記述する画像フォーマットはどれか。", "opts": ["OpenGL", "PNG", "SVG", "TIFF"], "ans": 2, "abbr": "SVG = Scalable Vector Graphics", "note": "点の集まり（ラスタ）ではなく、図形の定義（ベクタ）で持つ。拡大しても粗くならず、テキストなので検索や編集もできる。", "plus": "8回中1回出題（R7春問8）。ラスタ形式が PNG・JPEG・GIF・TIFF。OpenGL は画像形式ではなく 3D 描画の API。"}, {"cat": "問8-10 DB", "q": "バーチャルリアリティに関する記述のうち、レンダリングの説明はどれか。", "opts": ["ウェアラブルカメラ、慣性センサーなどを用いて非言語情報を認識する処理", "仮想世界の情報をディスプレイに描画可能な形式の画像に変換する処理", "現実世界と仮想世界を融合させるために、それぞれの3次元座標を一致させる処理", "時間経過とともに生じる物の移動などの変化を、物理法則に当てはめて変化させる処理"], "ans": 1, "abbr": "―", "note": "レンダリング＝モデルのデータから「見える絵」を作る工程。光源や視点を考慮して明暗や影を計算する。", "plus": "8回中1回出題（R5秋問8）。ウはレジストレーション（位置合わせ）、エはシミュレーション。3DCG の工程は モデリング → テクスチャ → ライティング → レンダリング。"}, {"cat": "問8-10 DB", "q": "ビットマップフォントよりもアウトラインフォントの利用が適しているのはどれか。", "opts": ["英数字だけでなく、漢字も表示する", "各文字の幅を一定にして表示する", "画面上にできるだけ高速に表示する", "文字を任意の倍率に拡大して表示する"], "ans": 3, "abbr": "―", "note": "アウトラインフォントは文字の輪郭を数式で持つ。どんな倍率でも滑らかに描ける。ビットマップは点の集まりなので、拡大するとギザギザになる。", "plus": "8回中1回出題（R6春問8）。高速表示はビットマップのほうが有利（計算が不要）。SVG がベクタなのと同じ考え方。"}, {"cat": "問8-10 DB", "q": "大量のデータを分析用に統合・蓄積し、時系列で保持するデータベースはどれか。", "opts": ["データウェアハウス", "データマート", "データレイク", "データディクショナリ"], "ans": 0, "abbr": "DWH = Data Warehouse ／ ETL = Extract / Transform / Load", "note": "業務システムのデータを集めて、分析専用に持ち直す。更新せず、時系列で積み上げるのが特徴。", "plus": "データマート＝部門向けに切り出した小さな DWH。データレイク＝加工せず生のまま貯める。データディクショナリ＝メタデータの管理台帳。"}, {"cat": "問11-15 NW", "q": "IP アドレスの自動設定をするために DHCP サーバが設置された LAN 環境の説明のうち、適切なものはどれか。", "opts": ["自動設定を行う PC では、IP アドレスは設定できるが、サブネットマスクやデフォルトゲートウェイは設定できない", "自動設定を行う PC と、IP アドレスが固定の PC を混在させることはできない", "自動設定を行う PC に、DHCP サーバのアドレスを設定しておく必要はない", "一度 IP アドレスを割り当てられた PC は、電源が切られた期間があっても必ず同じ IP アドレスが割り当てられる"], "ans": 2, "abbr": "DHCP = Dynamic Host Configuration Protocol", "note": "PC はブロードキャストで DHCP サーバを探すので、サーバのアドレスを知らなくてよい。やり取りは DISCOVER → OFFER → REQUEST → ACK。", "plus": "8回中1回出題（R4秋問11）。サブネットマスク・デフォルトゲートウェイ・DNS も配布できる。別セグメントのサーバを使うには DHCP リレーエージェントが要る。"}, {"cat": "問11-15 NW", "q": "IPv4 の LAN に接続されているプリンターの MAC アドレスを、同一 LAN 上の PC から調べるときに使用するコマンドはどれか。", "opts": ["arp", "ipconfig", "netstat", "ping"], "ans": 0, "abbr": "ARP = Address Resolution Protocol", "note": "arp -a で、IP アドレスと MAC アドレスの対応表（ARP テーブル）を表示できる。直前に通信していればキャッシュに残っている。", "plus": "8回中1回出題（R6秋問12）。ipconfig は自分の設定を見る。netstat は接続状態。ping は疎通確認（ICMP）。IPv6 では ARP の代わりに NDP を使う。"}, {"cat": "問11-15 NW", "q": "DNS に関する記述のうち、適切なものはどれか。", "opts": ["DNS サーバのホスト名を登録するレコードを MX レコードという", "DNS サーバに問い合わせを行うソフトウェアをレゾリューションという", "IP アドレスに対応するホスト名を調べることを逆引きという", "ホスト名に対し別名を登録するレコードを NS レコードという"], "ans": 2, "abbr": "DNS = Domain Name System", "note": "名前 → IP が正引き、IP → 名前が逆引き。逆引きには in-addr.arpa ドメインの PTR レコードを使う。メールサーバの正当性確認などに利用される。", "plus": "8回中1回出題（R6秋問11）。MX＝メールサーバ、NS＝ネームサーバ、CNAME＝別名、A＝IPv4、AAAA＝IPv6。問い合わせるソフトはリゾルバ（レゾリューションではない）。"}, {"cat": "問11-15 NW", "q": "DNS キャッシュポイズニング攻撃に対して有効な対策はどれか。", "opts": ["DNS サーバにおいて、侵入したマルウェアをリアルタイムに隔離する", "DNS 問合せに使用する DNS ヘッダー内の ID を固定せずにランダムに変更する", "DNS 問合せに使用する送信元ポート番号を53番に固定する", "外部からの DNS 問合せに対しては、宛先ポート番号53のものだけに応答する"], "ans": 1, "abbr": "―", "note": "攻撃者は偽の応答を先に送り込もうとする。問合せ ID と送信元ポートをランダムにすると、当てる組合せが膨大になり成功しにくくなる。", "plus": "8回中1回出題（R6秋問15）。根本対策は DNSSEC（応答に電子署名）。ウのようにポートを固定するのは逆効果で、予測されやすくなる。"}, {"cat": "問11-15 NW", "q": "無線 LAN のアクセスポイントや IP 電話機などに、LAN ケーブルを利用して給電も行う仕組みはどれか。", "opts": ["PLC", "PoE", "UPS", "USB"], "ans": 1, "abbr": "PoE = Power over Ethernet", "note": "LAN ケーブル1本で通信と電源の両方を供給する。電源コンセントのない天井などに機器を置ける。IEEE 802.3af/at/bt で規格化。", "plus": "8回中1回出題（R7春問11）。PLC は電力線を通信に使う逆の発想。UPS は無停電電源装置。IoT の給電では エネルギーハーベスティングとの対比で出る。"}, {"cat": "問11-15 NW", "q": "CSMA/CD 方式の LAN に接続されたノードの送信動作として、適切なものはどれか。", "opts": ["各ノードに論理的な順位付けを行い、送信権を順次受け渡す", "伝送媒体が使用中かどうかを調べ、使用中でなければ送信する。衝突を検出したらランダムな時間の経過後に再度送信する", "各ノードを環状に接続し、送信権を制御するフレームを巡回させる", "タイムスロットを割り当てられたノードだけが送信を行う"], "ans": 1, "abbr": "CSMA/CD = Carrier Sense Multiple Access with Collision Detection", "note": "「聞いてから話す、ぶつかったら待って言い直す」方式。半二重のイーサネットで使われた。現在のスイッチング環境（全二重）では衝突自体が起きない。", "plus": "8回中1回出題（R6春問10）。ウはトークンリング、エは TDMA。無線 LAN は衝突検出ができないため、回避する CSMA/CA を使う。"}, {"cat": "問11-15 NW", "q": "IPsec、L2TP、TLS の OSI 基本参照モデルにおける相対的な位置関係として、上位層から順に並べたものはどれか。", "opts": ["TLS → L2TP → IPsec", "IPsec → L2TP → TLS", "TLS → IPsec → L2TP", "L2TP → TLS → IPsec"], "ans": 0, "abbr": "L2TP = Layer 2 Tunneling Protocol", "note": "TLS はトランスポート層の上（第4〜5層）、IPsec はネットワーク層（第3層）、L2TP はデータリンク層（第2層）。上から TLS → IPsec → L2TP ではなく、L2TP は IPsec より下。", "plus": "8回中1回出題（R7春問15）。正しくは上位から TLS・IPsec・L2TP の順。名前に Layer 2 と入っている L2TP が最下位、と覚えると速い。"}, {"cat": "問11-15 NW", "q": "PC からサーバに対し、IPv6 を利用した通信を行う場合、ネットワーク層で暗号化を行うときに利用するものはどれか。", "opts": ["IPsec", "PPP", "SSH", "TLS"], "ans": 0, "abbr": "IPsec = Security Architecture for Internet Protocol", "note": "ネットワーク層（第3層）で暗号化するので、上位のアプリケーションを変えずに全通信を保護できる。IPv6 では標準で組み込まれている。", "plus": "8回中1回出題（R6春問15）。TLS はトランスポート層より上。SSH はアプリケーション層。PPP はデータリンク層で暗号化機能はない。"}, {"cat": "問11-15 NW", "q": "リバースプロキシの説明として、適切なものはどれか。", "opts": ["インターネットから内部ネットワークの公開 Web サーバへの通信を、中継するために利用される", "インターネットと内部ネットワークとの通信を監視し、攻撃を検知するための技術である", "仮想的な専用ネットワークを確立するための技術である", "内部ネットワークの PC からインターネットへの通信を、中継するために利用される"], "ans": 0, "abbr": "―", "note": "外から見える窓口を1つにして、内部構成を隠す。TLS の終端、負荷分散、キャッシュも担える。WAF もこの形で実装されることが多い。", "plus": "8回中1回出題（R7秋問11）。エはフォワードプロキシ（内部の利用者が外へ出るときに通す）。向きが逆なので、問題文の矢印の向きを必ず確認する。"}, {"cat": "問11-15 NW", "q": "家庭内で PC を無線 LAN ルータを介してインターネットに接続するとき、期待できるセキュリティ上の効果の記述として適切なものはどれか。", "opts": ["IP マスカレード機能による、インターネットからの侵入に対する防止効果", "PPPoE 機能による、経路上の盗聴に対する防止効果", "WPA 機能による、不正な Web サイトへの接続に対する防止効果", "WPS 機能による、インターネットからのマルウェア感染に対する防止効果"], "ans": 0, "abbr": "―", "note": "IP マスカレード（NAPT）は内部をプライベート IP にするので、外から直接アドレスを指定して入って来られない。副次的な効果だが実質的に機能する。", "plus": "8回中1回出題（R4秋問15）。WPA は無線区間の暗号化（Web サイトのフィルタではない）。WPS は接続設定を簡単にする機能で、セキュリティ強化ではない。"}, {"cat": "問11-15 NW", "q": "組織の業務環境で、特定の IP セグメントのアドレスを動的に割り当て、認証結果に応じて接続先ネットワークを切り替える技術はどれか。", "opts": ["IDS", "IP マスカレード", "スタティック VLAN", "認証 VLAN"], "ans": 3, "abbr": "―", "note": "利用者を認証し、その結果に応じて割り当てる VLAN を変える。フリーアドレスで席が変わっても、同じ人は同じネットワークに入る。", "plus": "8回中1回出題（R5春問15）。スタティック VLAN はポート単位の固定割当てなので、席が変わると使えない。IEEE 802.1X ＋ RADIUS で実装する。"}, {"cat": "問11-15 NW", "q": "自社の中継用メールサーバのログから、外部ネットワークからの第三者中継と判断できる組合せはどれか。", "opts": ["接続元が自社、送信者が自社ドメイン、受信者が他社ドメイン", "接続元が自社、送信者も受信者も自社ドメイン", "接続元が社外、送信者が他社ドメイン、受信者も別の他社ドメイン", "接続元が社外、送信者が他社ドメイン、受信者が自社ドメイン"], "ans": 2, "abbr": "―", "note": "第三者中継＝自社サーバが、自社と無関係な送信者から無関係な宛先へメールを運ばされること。接続元も送信者も受信者も社外なら中継されている。", "plus": "8回中1回出題（R5秋問13）。エは外部から自社宛なので正常な受信。対策は SMTP 認証（SMTP-AUTH）、POP before SMTP、OP25B。"}, {"cat": "問11-15 Sec", "q": "デジタル署名が付与されたソフトウェアをインストールするときに、そのソフトウェアの発行元を確認するために使用する証明書はどれか。", "opts": ["EV SSL 証明書", "クライアント証明書", "コードサイニング証明書", "サーバ証明書"], "ans": 2, "abbr": "―", "note": "ソフトウェアに署名するための証明書。配布途中で改ざんされていないこと、発行元が本物であることを示す。", "plus": "8回中1回出題（R7秋問13）。サーバ証明書＝Web サーバの身元。クライアント証明書＝利用者端末の身元。EV SSL＝審査を厳格にしたサーバ証明書。用途別に4つを整理する。"}, {"cat": "問11-15 Sec", "q": "デジタル証明書が失効しているかどうかをオンラインで確認するためのプロトコルはどれか。", "opts": ["CHAP", "LDAP", "OCSP", "SNMP"], "ans": 2, "abbr": "OCSP = Online Certificate Status Protocol", "note": "証明書が有効か、その都度サーバに問い合わせる。一覧を丸ごと取得する CRL より新鮮で軽い。", "plus": "8回中1回出題（R4秋問12）。CRL＝失効リスト（定期更新・大きくなる）。OCSP ステープリングは、Web サーバが代理で取得して提示する方式。"}, {"cat": "問11-15 Sec", "q": "電子メールの送信時に、送信側メールサーバでデジタル署名をヘッダーに付与し、受信側で検証することで、なりすましや改ざんを検知できる技術はどれか。", "opts": ["DKIM", "OP25B", "S/MIME", "SPF"], "ans": 0, "abbr": "DKIM = DomainKeys Identified Mail", "note": "送信側が秘密鍵で署名し、公開鍵を DNS に置く。受信側が照合して「本当にそのドメインが送ったか」を確かめる。転送されても壊れにくい。", "plus": "8回中2回出題（R7秋問15・R5秋問15）の頻出枠。SPF＝送信元IPで検証（転送に弱い）。DMARC＝両者の結果で処理方針を宣言。S/MIME は利用者個人の署名・暗号化。"}, {"cat": "問11-15 Sec", "q": "サイバー攻撃の攻撃段階をモデル化したサイバーキルチェーンにおいて、“エクスプロイト”に該当する行為はどれか。", "opts": ["公開情報の閲覧や問合せなどを行い、標的とする組織を調査する", "標的とする組織の PC で OS の脆弱性を悪用し、攻撃ツールを実行させる", "標的とする組織のサーバから秘密情報を窃取し、攻撃者のサーバに送信する", "標的とする組織の従業員にマルウェアを添付した電子メールを送りつける"], "ans": 1, "abbr": "―", "note": "エクスプロイト＝脆弱性を突いて実際にコードを動かす段階。偵察 → 武器化 → デリバリ → エクスプロイト → インストール → C&C → 目的の実行、の4番目。", "plus": "8回中1回出題（R7秋問12）。アは偵察、エはデリバリ、ウは目的の実行。7段階の順番を押さえると、どの選択肢がどこかが即座に分かる。"}, {"cat": "問11-15 Sec", "q": "エクスプロイトコードの説明はどれか。", "opts": ["攻撃コードとも呼ばれ、ソフトウェアの脆弱性を悪用するコードのことであり、使い方によっては脆弱性の検証に役立つこともある", "マルウェア定義ファイルとも呼ばれ、マルウェアを特定するための特徴的なコードである", "メッセージとシークレットデータから計算されるハッシュコードである", "ログインのたびに変化する認証コードである"], "ans": 0, "abbr": "―", "note": "脆弱性を実際に突くためのコード。悪用もできるが、防御側が「本当に危ないか」を確かめるためにも使う（ペネトレーションテスト）。", "plus": "8回中1回出題（R6秋問16）。イはシグネチャ、ウは MAC（メッセージ認証コード）、エはワンタイムパスワード。似た語を並べる典型。"}, {"cat": "問11-15 Sec", "q": "JVN などの脆弱性情報サイトで採用されている CVE 識別子の説明はどれか。", "opts": ["コンピュータで必要なセキュリティ設定項目を識別するための識別子", "脆弱性が悪用されて改ざんされた Web サイトのスクリーンショットを識別するための識別子", "製品に含まれる脆弱性を識別するための識別子", "セキュリティ製品の種別を識別するための識別子"], "ans": 2, "abbr": "CVE = Common Vulnerabilities and Exposures", "note": "個々の脆弱性に付ける世界共通の番号（CVE-2021-44228 など）。これがあるので、別々のベンダーの情報を突き合わせられる。", "plus": "8回中1回出題（R6秋問14）。CCE＝セキュリティ設定項目（ア）。CWE＝脆弱性の種類（分類）。CPE＝製品の識別。CVSS＝深刻度のスコア。5つをセットで覚える。"}, {"cat": "問11-15 Sec", "q": "ソフトウェアの情報セキュリティ対策のうち、SBOM 管理ツールを用いることができるものはどれか。", "opts": ["ソフトウェアでの利用者認証に用いるアカウントの一元管理", "ソフトウェアについての脆弱性管理", "ソースコードについてのバージョン管理、アクセス制御及び改ざん防止", "ソースコードのバックアップとマルウェア混入防止"], "ans": 1, "abbr": "SBOM = Software Bill Of Materials（ソフトウェア部品表）", "note": "「この製品は何でできているか」の部品表。脆弱性が公表されたとき、影響する製品を即座に特定できる。", "plus": "8回中1回出題（R7春問13）。Log4Shell で「自社製品が Log4j を使っているか分からない」事態が多発したのが普及の契機。形式は SPDX、CycloneDX。"}, {"cat": "問11-15 Sec", "q": "ディープフェイクを悪用した攻撃に該当するものはどれか。", "opts": ["AI 技術によって加工した CEO の音声を使用して従業員に電話をかけ、指定した銀行口座に送金するよう指示した", "企業の PC をランサムウェアに感染させ、復号鍵と引き換えに暗号資産を送付するよう指示した", "秘密情報を不正に取得したと誤認させる電子メールを送付し、公開しないことと引換えに暗号資産を要求した", "ダークウェブで入手した認証情報で CEO のメールアカウントに不正ログインし、偽りのメールを送付した"], "ans": 0, "abbr": "―", "note": "ディープフェイク＝AI で本物そっくりの音声や映像を作る技術。声を偽装して指示を出す手口が実際に発生している。", "plus": "8回中1回出題（R6秋問13）。イはランサムウェア、ウはセクストーション型の脅迫、エはビジネスメール詐欺（BEC）。4つを手口別に整理する。"}, {"cat": "問11-15 Sec", "q": "WAF による防御が有効な攻撃として、最も適切なものはどれか。", "opts": ["DNS サーバに対する DNS キャッシュポイズニング", "REST API サービスに対する API の脆弱性を狙った攻撃", "SMTP サーバの第三者不正中継の脆弱性を悪用したフィッシングメールの配信", "電子メールサービスに対する電子メール爆弾"], "ans": 1, "abbr": "WAF = Web Application Firewall", "note": "WAF は HTTP/HTTPS の中身を見る。Web アプリや REST API への攻撃が守備範囲。DNS やメールのプロトコルは対象外。", "plus": "8回中1回出題（R4秋問14）。ファイアウォール＝ポート・IP（L3/L4）。IPS＝ネットワーク全般（L3〜L7）。WAF＝Web アプリ特化（L7）。守る層で切り分ける。"}, {"cat": "問11-15 Sec", "q": "JIS Q 31000:2019（リスクマネジメント−指針）におけるリスクアセスメントを構成するプロセスの組合せはどれか。", "opts": ["リスク特定、リスク評価、リスク受容", "リスク特定、リスク分析、リスク評価", "リスク分析、リスク対応、リスク受容", "リスク分析、リスク評価、リスク対応"], "ans": 1, "abbr": "―", "note": "アセスメント＝「見極める」までの3段階。特定（洗い出す）→ 分析（大きさを測る）→ 評価（対応が要るか判断）。対応はアセスメントの外。", "plus": "8回中1回出題（R4秋問13）。そのあとが リスク対応 ── 低減・回避・移転（共有）・受容。残ったものが残留リスク。順番と範囲の両方が問われる。"}, {"cat": "問11-15 Sec", "q": "JIS Q 27000:2019 における“真正性”の定義はどれか。", "opts": ["意図する行動と結果とが一貫しているという特性", "エンティティは、それが主張するとおりのものであるという特性", "認可されたエンティティが要求したときに、アクセス及び使用が可能であるという特性", "認可されていない個人、エンティティ又はプロセスに対して、情報を使用させず、開示しないという特性"], "ans": 1, "abbr": "―", "note": "真正性＝「名乗っているとおりの本人・本物である」こと。なりすましでないことを保証する性質。", "plus": "8回中1回出題（R7秋問14）。アは信頼性、ウは可用性、エは機密性。CIA の3要素＋真正性・責任追跡性・否認防止・信頼性＝7要素。定義文を取り違えさせる形式。"}, {"cat": "問11-15 Sec", "q": "デジタル庁、総務省及び経済産業省が策定した CRYPTREC 暗号リストのうち、電子政府推奨暗号リストの説明はどれか。", "opts": ["安全性及び実装性能が確認され、市場における利用実績が十分であるか今後の普及が見込まれ、利用を推奨するもの", "候補段階に格下げされ、互換性維持目的で利用する暗号技術のリスト", "安全性に問題が生じたため、互換性維持目的に限って利用するもの", "実装性能が未確認で、今後評価する予定の暗号技術のリスト"], "ans": 0, "abbr": "CRYPTREC = Cryptography Research and Evaluation Committees", "note": "3つのリストがある。電子政府推奨＝安全性も実績も十分で推奨。推奨候補＝安全性は確認済みだが実績がこれから。運用監視＝安全性に問題があり互換性維持のみ。", "plus": "8回中1回出題（R7春問12）。イ・ウは運用監視暗号リストの説明。「推奨」「候補」「監視」の3段階と、それぞれの位置づけを対応させる。"}, {"cat": "問11-15 Sec", "q": "パスワードクラック手法の一種である、レインボーテーブル攻撃に該当するものはどれか。", "opts": ["事前に入手した利用者 ID とパスワードのリストで、使い回しを狙ってログインを試行する", "パスワードに成り得る文字列の全てを用いて、総当たりでログインを試行する", "平文のパスワードとハッシュ値をチェーンによって管理するテーブルを用いて、入手したハッシュ値からパスワードを解読する", "利用者の誕生日、電話番号などの個人情報を言葉巧みに聞き出して、パスワードを類推する"], "ans": 2, "abbr": "―", "note": "ハッシュ値から元のパスワードを逆引きするための、あらかじめ計算した対応表。チェーン方式で容量を圧縮しているのが特徴。", "plus": "8回中1回出題（R5秋問12）。対策はソルト（利用者ごとの付加値）。アはパスワードリスト攻撃、イはブルートフォース、エはソーシャルエンジニアリング。"}, {"cat": "問11-15 Sec", "q": "自社製品の脆弱性に起因するリスクに対応するための社内機能として、最も適切なものはどれか。", "opts": ["CSIRT", "PSIRT", "SOC", "WHOIS データベースの技術連絡担当"], "ans": 1, "abbr": "PSIRT = Product Security Incident Response Team", "note": "自社が「出している製品」の脆弱性に対応する組織。パッチを作り、利用者へ注意喚起する。製品を売る企業に必要。", "plus": "8回中1回出題（R6春問14）。CSIRT＝自組織のインシデント対応。SOC＝監視が主務（24時間）。守る対象が「製品」か「自組織」かで分かれる。"}, {"cat": "問11-15 Sec", "q": "JPCERT コーディネーションセンターの CSIRT ガイドにおいて、コーディネーションセンターの機能とサービス対象の組合せはどれか。", "opts": ["インシデント対応の中で、CSIRT 間の情報連携・調整を行う／他の CSIRT", "インシデントの傾向分析やマルウェア解析を行う／関係組織、国又は地域", "自社製品の脆弱性に対応し、パッチ作成や注意喚起を行う／自社製品の利用者", "組織内 CSIRT の機能の一部又は全部をサービスプロバイダとして有償で請け負う／顧客"], "ans": 0, "abbr": "―", "note": "コーディネーションセンター＝CSIRT 同士をつなぐ調整役。自分で対応するのではなく、関係者の間に立って情報を回す。JPCERT/CC がこれ。", "plus": "8回中1回出題（R5秋問14）。イは分析センター、ウは PSIRT、エは MSSP（マネージドセキュリティサービスプロバイダ）。6分類のうち主要な4つ。"}, {"cat": "問11-15 Sec", "q": "3D セキュア 2.0（EMV 3-D セキュア）で利用される本人認証の特徴はどれか。", "opts": ["パスワードを忘れた場合でも、安全にパスワードを再発行できる", "過去の取引履歴や決済に用いているデバイスの情報から不正利用や高リスクと判断される場合に、カード会社が追加の本人認証を行う", "取引履歴やデバイス情報にかかわらず、カード会社がパスワードと生体認証を併用した本人認証を行う", "デバイス情報に加えて、操作しているのが人間であることを確認した上で、カード会社が追加の本人認証を行う"], "ans": 1, "abbr": "EMV 3-D Secure", "note": "リスクベース認証。普段どおりの取引なら追加認証なしで通し、怪しいときだけ本人確認を求める。利便性と安全性の両立。", "plus": "8回中1回出題（R6春問12）。旧 3D セキュア 1.0 は毎回パスワードを求めたため、離脱が多かった。その反省から 2.0 でリスクベースになった。"}, {"cat": "問11-15 Sec", "q": "OS コマンドインジェクション対策として、適切なものはどれか。", "opts": ["SQL 文の組立ては全てプレースホルダで実装する", "シェルを起動できる言語機能を利用した実装を避ける", "直接メモリにアクセスできる言語機能を利用した実装を避ける", "利用者が入力したファイル名にディレクトリが含まれていないかのエラーチェックを実装する"], "ans": 1, "abbr": "―", "note": "OS コマンドインジェクション＝入力値が OS のコマンドとして実行されてしまう脆弱性。そもそもシェルを呼ばない実装にするのが根本対策。", "plus": "8回中1回出題（R7春問14）。アは SQL インジェクション対策、ウはバッファオーバフロー対策、エはディレクトリトラバーサル対策。脆弱性と対策の組合せを問う形式。"}, {"cat": "問11-15 Sec", "q": "ISMS 内部監査を行った結果、監査人が指摘事項として監査報告書に記載すべきものはどれか。", "opts": ["USB メモリの使用を、定められた手順に従って許可していた", "個人情報の誤廃棄事故を主務官庁などに、規定されたとおりに報告していた", "マルウェアスキャンでスパイウェアが検知され、駆除されていた", "リスクアセスメントを実施した後に、リスク受容基準を決めていた"], "ans": 3, "abbr": "―", "note": "リスク受容基準は、アセスメントを始める前に決めておくもの。あとから決めると、都合のよい基準にできてしまう。手順の順序が逆という指摘。", "plus": "8回中1回出題（R4秋問21）。ア・イ・ウはいずれも規定どおりに運用できている例で、指摘事項にはならない。「順序」「事前・事後」が論点になりやすい。"}, {"cat": "問11-15 Sec", "q": "情報セキュリティにおける多要素認証の説明として、適切なものはどれか。", "opts": ["知識・所持・生体のうち、異なる2つ以上の要素を組み合わせる", "同じ要素の認証を2回連続して行う", "認証を複数のシステムで共有し、一度の認証で済ませる", "利用者の行動パターンから異常を検知して認証を強化する"], "ans": 0, "abbr": "MFA = Multi-Factor Authentication", "note": "パスワード（知識）＋スマホのコード（所持）＋指紋（生体）。種類の違う要素を組み合わせるのが要件。", "plus": "「パスワード2回」は段階が2つでも要素は1つなので多要素ではない（二段階認証）。ウはシングルサインオン、エはリスクベース認証。"}, {"cat": "問11-15 Sec", "q": "ネットワーク上のすべての通信を信頼せず、アクセスのたびに検証する考え方はどれか。", "opts": ["ゼロトラスト", "多層防御", "境界型防御", "最小権限の原則"], "ans": 0, "abbr": "―", "note": "「社内だから安全」をやめる。場所ではなく、利用者・端末・文脈を毎回確認してから通す。テレワークとクラウドで境界が消えたことが背景。", "plus": "境界型防御＝外と内を分けて内は信頼する（従来型）。多層防御＝複数の対策を重ねる（ゼロトラストと両立する）。実装要素は IAM・MFA・EDR・マイクロセグメンテーション。"}, {"cat": "問11-15 Sec", "q": "送信元を偽装したパケットを、インタフェースの経路情報と照合して破棄する機能はどれか。", "opts": ["uRPF", "NAT", "QoS", "STP"], "ans": 0, "abbr": "uRPF = unicast Reverse Path Forwarding", "note": "「その送信元 IP なら、本来このインタフェースから来るはず」を逆引きして確認する。合わなければ偽装とみなして捨てる。", "plus": "IP スプーフィング対策の基本。DDoS の踏み台化を防ぐ効果もある。Strict モード（経路が完全一致）と Loose モード（経路表にあればよい）がある。"}, {"cat": "問16-17 開発", "q": "UML の図のうち、業務要件定義において業務フローを記述する際に使用する、処理の分岐や並行処理、処理の同期などを表現できる図はどれか。", "opts": ["アクティビティ図", "クラス図", "状態マシン図", "ユースケース図"], "ans": 0, "abbr": "UML = Unified Modeling Language", "note": "アクティビティ図＝流れ図の UML 版。分岐（ひし形）、並行（太線）、同期を表せる。業務フローの記述に使う。", "plus": "★8回中3回出題（R7秋問16・R6秋問25・R4春問25）の最頻出枠。クラス図＝静的構造。状態マシン図＝1つのオブジェクトの状態遷移。ユースケース図＝システムと利用者の関わり。"}, {"cat": "問16-17 開発", "q": "UML のダイアグラムのうち、インスタンス間の関係を表現するものはどれか。", "opts": ["アクティビティ図", "オブジェクト図", "コンポーネント図", "ユースケース図"], "ans": 1, "abbr": "―", "note": "クラス図が「設計図」なら、オブジェクト図は「ある瞬間のスナップショット」。実際に存在するインスタンスとその関係を書く。", "plus": "R7秋問16 で出題。クラス図とオブジェクト図は見た目が似ているが、オブジェクト図は名前に下線が付く。UML は出る図が毎回変わるので、全種類を押さえる。"}, {"cat": "問16-17 開発", "q": "仕様書やソースコードといった成果物について、作成者を含めた複数人で、記述されたシステムの振る舞いを机上でシミュレートして問題点を発見する手法はどれか。", "opts": ["ウォークスルー", "サンドイッチテスト", "トップダウンテスト", "並行シミュレーション"], "ans": 0, "abbr": "―", "note": "作成者が中心となって説明し、参加者が疑問を出す。欠陥を早期に見つけるのが目的で、人事評価には使わない。", "plus": "★8回中3回出題（R7春問21・R6秋問21・R4秋問16）の最頻出枠。インスペクション＝モデレータが進行する公式なレビュー。ラウンドロビン＝持ち回りで司会をする。"}, {"cat": "問16-17 開発", "q": "モジュールの独立性を高めるために、モジュール間の情報の受渡し方法のうち、モジュール結合度が最も低いものはどれか。", "opts": ["共通域に定義したデータを関係するモジュールが参照する", "制御パラメータを引数として渡し、モジュールの実行順序を制御する", "入出力に必要なデータ項目だけをモジュール間の引数として渡す", "必要なデータを外部宣言して共有する"], "ans": 2, "abbr": "―", "note": "必要なデータだけを引数で渡すのがデータ結合＝最も弱い結合。結合度は低いほど独立性が高く、良い設計とされる。", "plus": "R5春問16 で出題。結合度は弱い順に データ結合 < スタンプ結合 < 制御結合 < 外部結合 < 共通結合 < 内容結合。逆に強度（凝集度）は 機能的凝集が最も強い。"}, {"cat": "問16-17 開発", "q": "ソフトウェア保守の分類のうち、問題は発生していないが、将来の問題を予防するために行う保守はどれか。", "opts": ["完全化保守", "是正保守", "適応保守", "予防保守"], "ans": 3, "abbr": "―", "note": "障害が起きる前に手を打つ。仕様書とソースコードの不整合を直す、といった作業がこれにあたる。", "plus": "R4春問17 で出題。是正保守＝発生した障害を直す。適応保守＝OS 更新など環境変化に合わせる。完全化保守＝性能や保守性を改善する。4分類は JIS X 0161。"}, {"cat": "問16-17 開発", "q": "デザインレビューの目的はどれか。", "opts": ["設計工程内で、設計工程の成果物の問題点を発見する", "品質保証部門が、全成果物の出荷の可否を判定する", "品質保証部門によるサンプリング検査で、設計者が気付かない問題点を発見する", "プロジェクトマネジメントのプロセス上の問題点を発見する"], "ans": 0, "abbr": "―", "note": "設計の段階で設計の誤りを見つける。後工程で見つけると手戻りが大きいので、その場で潰す。", "plus": "R7春問16 で出題。「設計工程内で」「設計工程の成果物を」という二重の限定がポイント。出荷判定や PM のプロセスは対象外。"}, {"cat": "問16-17 開発", "q": "ソフトウェア信頼度成長モデルの一つであって、テスト工程でバグが収束したと判定する根拠に使用する曲線はどれか。", "opts": ["累積誤り検出数が S 字型に推移し、やがて水平に近づく曲線", "累積誤り検出数が指数関数的に増え続ける曲線", "累積誤り検出数が直線的に増える曲線", "累積誤り検出数が対数的に急増したあと水平になる曲線"], "ans": 0, "abbr": "―", "note": "ゴンペルツ曲線。最初はゆるやか、途中で急増、最後に頭打ちの S 字。水平に近づいたら「もう出尽くした」と判断する。", "plus": "R6春問17 で出題（グラフを選ぶ形式）。右肩上がりのまま終わる曲線は「まだバグが残っている」ことを示すので、収束の根拠にならない。"}, {"cat": "問16-17 開発", "q": "外部仕様だけを基にテストケースを作成し、内部構造を考慮しないテスト手法はどれか。", "opts": ["ブラックボックステスト", "ホワイトボックステスト", "グレーボックステスト", "静的テスト"], "ans": 0, "abbr": "―", "note": "入力と出力だけを見る。同値分割（代表値で試す）と限界値分析（境界の前後）でケースを作る。", "plus": "ホワイトボックスは内部のコード経路を見る。網羅基準は 命令網羅 < 判定条件網羅 < 条件網羅 < 複数条件網羅。R4春問16 で判定条件網羅が出題。"}, {"cat": "問16-17 開発", "q": "モジュールを単体でテストするとき、呼び出される側の下位モジュールの代わりに用いる仮のモジュールはどれか。", "opts": ["スタブ", "ドライバ", "モック", "テストハーネス"], "ans": 0, "abbr": "―", "note": "スタブ＝呼ばれる側の代役。上から順にテストするトップダウンテストで使う。決まった値を返すだけの簡易な部品。", "plus": "ドライバ＝呼ぶ側の代役（ボトムアップテストで使う）。向きが逆。両方を併用するのがサンドイッチテスト。一気に全部つなぐのがビッグバンテスト。"}, {"cat": "問16-17 開発", "q": "アプリケーションの開発環境上で、用意された部品やテンプレートを GUI 操作で組み合わせ、必要に応じて一部のソースコードを記述して開発する手法はどれか。", "opts": ["継続的インテグレーション", "ノーコード開発", "プロトタイピング", "ローコード開発"], "ans": 3, "abbr": "―", "note": "ローコード＝「少しはコードを書く」。ノーコードは一切書かない。問題文に「一部のソースコードを記述」とあればローコード。", "plus": "R5秋問16 で出題。両者の違いはコードを書くかどうかの一点。市民開発（業務部門の人が自分で作る）という文脈で出題されやすい。"}, {"cat": "問16-17 開発", "q": "組込みシステムのソフトウェア開発に使われる IDE の説明として、適切なものはどれか。", "opts": ["エディター、コンパイラ、リンカ、デバッガなどが一体となったツール", "専用のハードウェアインタフェースで CPU の情報を取得する装置", "ターゲット CPU を搭載した評価ボードなどの実行環境", "タスクスケジューリングの仕組みなどを提供するソフトウェア"], "ans": 0, "abbr": "IDE = Integrated Development Environment（統合開発環境）", "note": "開発に必要な道具を1つにまとめたもの。Eclipse、Visual Studio など。", "plus": "R5秋問17 で出題。イは ICE（インサーキットエミュレータ）、ウは評価ボード、エは RTOS（リアルタイム OS）。組込み特有の用語4つをまとめて覚える。"}, {"cat": "問16-17 開発", "q": "稼働中のシステムからプログラム仕様や設計情報を抽出する作業はどれか。", "opts": ["リバースエンジニアリング", "フォワードエンジニアリング", "リファクタリング", "マイグレーション"], "ans": 0, "abbr": "―", "note": "設計書がない古いシステムを引き継ぐときに行う。抽出した設計から作り直すところまで含めるとリエンジニアリング。", "plus": "R4春問17 の予防保守の設問文にも登場（リバースエンジニアリングで仕様書を作り直す＝予防保守）。文脈で役割が変わるので注意。"}, {"cat": "問16-17 開発", "q": "外部から見た振る舞いを変えずに、プログラムの内部構造を改善する作業はどれか。", "opts": ["リファクタリング", "リバースエンジニアリング", "リエンジニアリング", "チューニング"], "ans": 0, "abbr": "―", "note": "動作は同じまま、読みやすく直す。自動テストが揃っていることが前提で、壊していないことを都度確認する。", "plus": "直す兆候が「コードの臭い」（重複、長すぎるメソッド、巨大クラス）。XP のプラクティスの一つで、TDD とセットで回す。"}, {"cat": "問16-17 開発", "q": "システム要件定義プロセスにおいて、トレーサビリティが確保されていることを説明した記述はどれか。", "opts": ["移行マニュアルや運用マニュアルの文書化が完了している", "外製する部分が決定され、調達先が選定され契約が締結されている", "モジュールの相互依存関係が確定している", "利害関係者の要求の根拠と成果物の相互関係が文書化されており、仕様変更時に品質に立ち返って検証できる"], "ans": 3, "abbr": "―", "note": "トレーサビリティ＝「この仕様はどの要求から来たか」をたどれること。仕様変更があったとき、影響範囲を特定できる。", "plus": "R5春問24 で出題。要求 → 要件 → 設計 → 実装 → テスト の対応関係を双方向にたどれる状態を指す。"}, {"cat": "問18-19 PM", "q": "EVM で管理しているプロジェクトにおいて、CPI が 0.9、SPI が 1.1 であるときの状況として適切なものはどれか。", "opts": ["コストが予算を超えているが、スケジュールには余裕がある", "コストには余裕があるが、スケジュールが遅れている", "コストもスケジュールも計画どおりである", "コストもスケジュールも計画より悪化している"], "ans": 0, "abbr": "CPI = Cost Performance Index ／ SPI = Schedule Performance Index", "note": "どちらも 1 が基準。1未満＝悪い、1超＝良い。CPI 0.9 はコスト超過、SPI 1.1 はスケジュール前倒し。", "plus": "★8回中3回出題（R7春問18・R6春問18・R4春問18）の最頻出枠。CPI = EV ÷ AC、SPI = EV ÷ PV。差異で見るなら CV = EV − AC、SV = EV − PV。"}, {"cat": "問18-19 PM", "q": "EVM において、完成時総コスト見積り（EAC）を求める式はどれか。ここで BAC は完成時総予算とする。", "opts": ["BAC ÷ CPI", "BAC × CPI", "BAC − EV", "AC + PV"], "ans": 0, "abbr": "EAC = Estimate At Completion ／ BAC = Budget At Completion", "note": "今のコスト効率がこのまま続くと仮定する。CPI が 0.8 なら、予算の 1.25 倍かかる計算になる。", "plus": "R4春問18 で計算問題として出題（BAC100・PV50・EV40・AC60 → CPI=40/60 → EAC=100÷(2/3)=150）。残作業の効率指標が TCPI。"}, {"cat": "問18-19 PM", "q": "EVM のグラフで、現時点において PV > AC > EV であるとき、今後の見通しとして適切なものはどれか。", "opts": ["計画に比べてコストは多くなり、完了は遅くなる", "計画に比べてコストは多くなり、完了は早くなる", "計画に比べてコストは少なくなり、完了は遅くなる", "計画に比べてコストは少なくなり、完了は早くなる"], "ans": 0, "abbr": "PV = Planned Value ／ EV = Earned Value ／ AC = Actual Cost", "note": "EV が一番下＝出来高が最も少ない。AC > EV なのでコスト超過、PV > EV なので進捗遅れ。両方悪い。", "plus": "R6春問18 で出題（グラフ読み取り）。3本の線の上下関係だけで判断できる。EV が一番下＝両方悪い、EV が一番上＝両方良い、と覚える。"}, {"cat": "問18-19 PM", "q": "プロジェクトの期間を短縮する方法のうち、クラッシングに該当するものはどれか。", "opts": ["作業の前後関係を組み直し、実施する順番を変える", "作業を分析し、同時に実施できる部分を複数の作業に分割して並行して実施する", "先行作業の一部の成果物が完成した時点で、後続作業を開始する", "プロジェクトの外部から要員を調達し、クリティカルパス上の作業に投入する"], "ans": 3, "abbr": "―", "note": "クラッシング＝資源を追加して短縮する。人を増やす、残業する、など。コストが増える。", "plus": "R7春問19 で出題。ファストトラッキング＝本来順番にやる作業を並行させる（イ・ウ）。コストは増えないがリスクが増える。2つの違いが定番の出題。"}, {"cat": "問18-19 PM", "q": "プロジェクトマネジメントにおけるファストトラッキングの例として、適切なものはどれか。", "opts": ["クリティカルパス上のアクティビティに人的資源を追加した", "コストを削減するために残業を禁止した", "仕様の確定が遅れたので、完了予定日を延期した", "設計が終わったモジュールから順にプログラム開発を実施し、スケジュールを短縮した"], "ans": 3, "abbr": "―", "note": "本来は「設計が全部終わってから開発」だが、終わったものから始める。並行させることで期間を縮める。", "plus": "R6秋問19 で出題。アはクラッシング。クラッシング＝資源を足す（コスト増）、ファストトラッキング＝並行させる（リスク増）。対で問われる。"}, {"cat": "問18-19 PM", "q": "プロジェクトマネジメントにおけるスコープの管理の活動はどれか。", "opts": ["開発ツールの教育期間を2日間延長した", "再見積りで開発コスト超過が判明したので、追加予算を確保した", "外部システムのリリースが延期になったので、連携作業を別プロジェクトで実施することにした", "テスト担当者が成果を出せなかったので、経験豊富な担当者と交代した"], "ans": 2, "abbr": "―", "note": "スコープ管理＝「やること・やらないこと」の線引き。作業を別プロジェクトへ移すのは、スコープから外す判断。", "plus": "R6秋問18 で出題。アは資源管理、イはコスト管理、エは資源管理。どの知識エリアの活動かを切り分ける形式。"}, {"cat": "問18-19 PM", "q": "プロジェクトマネジメントにおける“プロジェクト憲章”の説明はどれか。", "opts": ["実行・監視・管理の方法を規定するために、スケジュールやリスクなどのマネジメントの役割や責任を記した文書", "スコープを定義するために、目標、成果物、要求事項及び境界を記した文書", "目標を達成し必要な成果物を作成するために、実行する作業を階層構造で記した文書", "プロジェクトを正式に認可するために、ビジネスニーズ、目標、成果物、プロジェクトマネージャ及びその責任・権限を記した文書"], "ans": 3, "abbr": "―", "note": "憲章＝立ち上げを公式に認める文書。プロジェクトマネージャの権限もここで与えられる。これがないとプロジェクトは始まらない。", "plus": "R5春問18 で出題。アはプロジェクトマネジメント計画書、イはプロジェクトスコープ記述書、ウは WBS。4つの文書の役割を取り違えさせる典型。"}, {"cat": "問18-19 PM", "q": "PMBOK ガイド第7版によれば、プロジェクト・スコープ記述書に記述する項目はどれか。", "opts": ["WBS", "コスト見積額", "ステークホルダー分類", "プロジェクトの除外事項"], "ans": 3, "abbr": "PMBOK = Project Management Body of Knowledge", "note": "スコープ記述書には「やること」と同時に「やらないこと（除外事項）」を明記する。後から揉めないため。", "plus": "R5秋問18 で出題。WBS はスコープ記述書を基に作る別の成果物。コスト見積はコスト管理、ステークホルダー分類はステークホルダー登録簿。"}, {"cat": "問18-19 PM", "q": "チームの発展段階を五つに区分したタックマンモデルによれば、メンバーの異なる考え方や価値観が明確になり、意見を主張し合う段階はどれか。", "opts": ["安定期（Norming）", "遂行期（Performing）", "成立期（Forming）", "動乱期（Storming）"], "ans": 3, "abbr": "―", "note": "Forming（成立）→ Storming（動乱）→ Norming（安定）→ Performing（遂行）→ Adjourning（解散）。ぶつかる時期を経ないと本当のチームにならない。", "plus": "R7秋問18 で出題。英語の意味がそのまま段階名。Storm＝嵐＝ぶつかり合い、Norm＝規範＝ルールができる、と結びつけると速い。"}, {"cat": "問18-19 PM", "q": "スクラムにおいて、ステークホルダに作業の結果をプレゼンテーションし、プロダクトゴールに対する進捗を話し合い、必要に応じてスコープを調整するイベントはどれか。", "opts": ["スプリントプランニング", "スプリントレビュー", "デイリースクラム", "レトロスペクティブ"], "ans": 1, "abbr": "―", "note": "スプリントの最後に、できたものを見せて意見をもらう。「製品」を見る会。", "plus": "R7春問17 で出題。レトロスペクティブは「やり方」を振り返る会（製品ではなくプロセス）。プランニングは計画、デイリースクラムは毎日の同期。4イベントの目的を区別する。"}, {"cat": "問18-19 PM", "q": "スクラムのスプリントレトロスペクティブで用いる KPT 手法において、“T”に該当する例はどれか。", "opts": ["開発したプログラムは欠陥が少なかったので、今後もペアプログラミングを継続する", "スタンドアップミーティングにメンバー全員が集まらないことが多かった", "次のスプリントからは、スタンドアップミーティングにタイムキーパーを置き、終了5分前を知らせる", "テストコードの作成に見積り以上の時間が掛かった"], "ans": 2, "abbr": "KPT = Keep / Problem / Try", "note": "T＝Try＝「次に試すこと」。新しい取り組みを決める。ア＝Keep（続けること）、イ・エ＝Problem（問題点）。", "plus": "R4秋問17 で出題。「次のスプリントからは」という未来形の文言が Try の目印。過去形の記述は Keep か Problem。"}, {"cat": "問18-19 PM", "q": "プロジェクトのリスク対応のうち、保険をかけたり外部へ委託したりして、影響を第三者に移す戦略はどれか。", "opts": ["転嫁（移転）", "回避", "軽減", "受容"], "ans": 0, "abbr": "―", "note": "リスクそのものはなくならないが、損失の負担先を変える。保険、外部委託、クラウド利用などがこれにあたる。", "plus": "脅威への対応は 回避・軽減・転嫁・受容 の4つ。好機（プラスのリスク）側は 活用・強化・共有・受容。対応の種類を問う形式が定番。"}, {"cat": "問18-19 PM", "q": "ソフトウェアの機能数と複雑さから規模を算出し、工数を見積もる手法はどれか。", "opts": ["ファンクションポイント法", "類推見積法", "COCOMO", "デルファイ法"], "ans": 0, "abbr": "FP = Function Point", "note": "画面・帳票・ファイルなど「利用者から見える機能」を数える。プログラム言語に依存しないのが利点。", "plus": "類推法＝過去の類似案件から。COCOMO＝行数を基にした係数モデル。デルファイ法＝専門家に匿名アンケートを繰り返して収束させる。"}, {"cat": "問18-19 PM", "q": "リーダシップ論のうち、PM 理論の特徴はどれか。", "opts": ["優れたリーダがもつ性格、知性、外観などの個人的資質の分析に焦点を当てている", "リーダシップのスタイルについて、目標達成能力と集団維持能力の二つの次元に焦点を当てている", "リーダシップの有効性は、部下の成熟度という状況要因に依存するとしている", "リーダシップの有効性は、リーダのパーソナリティと統制力・影響力に依存するとしている"], "ans": 1, "abbr": "PM理論 = Performance（目標達成機能）／ Maintenance（集団維持機能）", "note": "P（成果を出す力）と M（チームをまとめる力）の2軸。両方高い PM 型が理想とされる。", "plus": "R4春問29 で出題。アは特性論、ウは SL理論（状況対応型）、エはコンティンジェンシー理論。4つの理論名と焦点を対応させる。"}, {"cat": "問20 SM", "q": "サービスマネジメントにおける問題管理の活動はどれか。", "opts": ["根本原因の特定", "サービス要求の優先度付け", "変更要求の記録", "リリースの検証"], "ans": 0, "abbr": "―", "note": "問題管理＝二度と起こさないために原因を突き止める活動。早く直すのはインシデント管理の役割で、目的が違う。", "plus": "★8回中2回出題（R7秋問20・R4秋問20）。イは要求実現、ウは変更管理、エはリリース管理。4つの活動を取り違えさせる形式が定番。"}, {"cat": "問20 SM", "q": "サービスマネジメントにおける問題管理の目的はどれか。", "opts": ["インシデントの解決を、合意したサービスレベル目標の時間枠内に達成することを確実にする", "インシデントの未知の根本原因を特定し、インシデントの発生又は再発を防ぐ", "合意した目標の中で、合意したサービス継続のコミットメントを果たすことを確実にする", "変更の影響を評価し、リスクを最小とするようにして実施し、レビューする"], "ans": 1, "abbr": "―", "note": "「未知の」根本原因を特定するのがポイント。原因が分かっているものは既知のエラーとして別に管理する。", "plus": "R4秋問20 で出題。アはインシデント管理、ウはサービス継続管理、エは変更管理。目的を述べる文のどこが各活動の核心かを読み分ける。"}, {"cat": "問20 SM", "q": "サービスマネジメントにおけるサービスレベル管理の活動はどれか。", "opts": ["現在の資源の調整と最適化を行い、将来の資源要件に関する予測を記載した計画を作成する", "サービスの提供に必要な予算に応じて、適切な資金を確保する", "事業が中断しても、要求されたサービス機能を合意された期間内に復旧できるよう、事業影響度の評価や復旧優先順位を明確にする", "提供するサービス及びサービスレベル目標を決定し、サービス提供者が顧客との間で合意文書を交わす"], "ans": 3, "abbr": "SLM = Service Level Management", "note": "何を・どの水準で提供するかを決めて、文書で合意する。合意して終わりではなく、測って報告して改善するまでが SLM。", "plus": "R6春問20 で出題。アはキャパシティ管理、イはサービス財務管理、ウはサービス継続管理。4つの活動の定義文を並べる形式。"}, {"cat": "問20 SM", "q": "中断したサービスを復旧させるときの目標を定めた指標のうち、RTO と RLO を定めた例として適切なものはどれか。", "opts": ["サービスが中断する3時間前の時点の状態にデータを復旧し、利用者の50%以上にサービスを提供できるようにする", "サービスが中断する直前の状態にデータを復旧し、終了時刻を中断時間だけ延長する", "サービスの中断から1時間以内に、中断する1時間前の時点の状態にデータを復旧する", "サービスの中断から1日以内に、重要なサービスに限定してサービスを復旧する"], "ans": 3, "abbr": "RTO = Recovery Time Objective ／ RPO = Recovery Point Objective ／ RLO = Recovery Level Objective", "note": "RTO＝いつまでに（1日以内）、RLO＝どの水準まで（重要なサービスに限定）。この2つが揃っているのがエ。", "plus": "R6秋問20 で出題。アは RPO（3時間前）＋ RLO（50%）。ウは RTO（1時間以内）＋ RPO（1時間前）。どの2つが組み合わさっているかを読み分ける。"}, {"cat": "問20 SM", "q": "ITIL において、可用性管理の KPI として“保守性を表す指標値”に該当するものはどれか。", "opts": ["一定期間内での中断の数", "平均故障間隔", "平均サービス・インシデント間隔", "平均サービス回復時間"], "ans": 3, "abbr": "MTTR = Mean Time To Repair（平均修復時間）", "note": "保守性＝「どれだけ早く直せるか」。平均サービス回復時間が短いほど保守性が高い。", "plus": "R4春問20 で出題。平均故障間隔（MTBF）は信頼性の指標。「保守性＝直す速さ＝MTTR」「信頼性＝壊れにくさ＝MTBF」の対応を押さえる。"}, {"cat": "問20 SM", "q": "JIS Q 20000-1 によれば、サービスレベル目標に照らしたパフォーマンスのレビューを、いつ行うと規定しているか。", "opts": ["SLA に大きな変更があったときに実施する", "あらかじめ定めた間隔で実施する", "間隔を定めず、必要に応じて実施する", "サービス目標の未達成が続いたときに実施する"], "ans": 1, "abbr": "―", "note": "「あらかじめ定めた間隔で」が規格の要求。問題が起きてからではなく、定期的に見る。", "plus": "R5春問20 で出題。マネジメントシステム規格はおおむね「定期的に」「計画された間隔で」と要求する。他の規格でも同じ言い回しが出る。"}, {"cat": "問20 SM", "q": "インシデントに対し、根本原因を取り除かずに暫定的にサービスを回復させる手段はどれか。", "opts": ["ワークアラウンド（回避策）", "恒久的対策", "エスカレーション", "インシデントの記録"], "ans": 0, "abbr": "―", "note": "「とりあえず動くようにする」。サーバを再起動する、別経路に切り替えるなど。原因究明は問題管理へ引き継ぐ。", "plus": "原因が分かっているが恒久対策が未実施の状態を「既知のエラー」といい、KEDB（既知のエラーデータベース）に登録する。"}, {"cat": "問20 SM", "q": "利用者からの問合せを受け付ける単一の窓口を何というか。", "opts": ["サービスデスク", "ヘルプデスク", "コールセンタ", "サポートセンタ"], "ans": 0, "abbr": "SPOC = Single Point Of Contact", "note": "窓口を1つにすることで、利用者は「どこに言えばいいか」を迷わない。記録も一元化できる。", "plus": "設置形態は ローカル（拠点ごと）・中央集中・バーチャル（分散だが一元化）・フォロー・ザ・サン（時差を使って24時間）の4つ。"}, {"cat": "問21-22 監査", "q": "システム監査における“監査手続”として、最も適切なものはどれか。", "opts": ["監査計画の立案や監査業務の進捗管理を行うための手順", "監査結果を受けて、監査報告書に監査人の結論や指摘事項を記述する手順", "監査項目について、十分かつ適切な証拠を入手するための手順", "監査テーマに合わせて、監査チームを編成する手順"], "ans": 2, "abbr": "―", "note": "監査手続＝「証拠を集めるやり方」。閲覧・観察・質問・再実施・突合など。結論を書く手順でも、チームを作る手順でもない。", "plus": "★8回中2回出題（R7春問22・R4秋問22）で、選択肢まで完全に同一。確実に取れる1問。監査証拠を得るための手順、と覚える。"}, {"cat": "問21-22 監査", "q": "システム監査基準（令和5年）において、システム監査で使用される用語の説明として適切なものはどれか。", "opts": ["所見とは、他の標準的な監査人が監査を実施した場合であっても同じ検証結果を得られることである", "正当な懐疑心とは、客観性の保持という精神的な態度を堅持できることである", "正当な注意とは、監査で発見したことに基づく考えや意見のことである", "独立性とは、第三者から不当な影響や圧力等を受けていない状態のことである"], "ans": 3, "abbr": "―", "note": "独立性＝外部から干渉されない立場。精神上の独立性（公正な心構え）と外観上の独立性（第三者から見てもそう見える）の両方が要る。", "plus": "R7秋問21 で出題。アは「再現性」の説明、イは「客観性」、ウは「所見」の説明。用語と定義を入れ替えた典型的な引っかけ。"}, {"cat": "問21-22 監査", "q": "システム監査基準（令和5年）に従い、監査目的に基づいて、ガバナンス、マネジメント、コントロールの視点から検証・評価を行う。“コントロールの視点”から行う項目はどれか。", "opts": ["IT 投資の結果が適切なリターンを生んでいるか", "異常なアクセスを検出した際に適時に対処及び報告がなされているか", "情報セキュリティ対策が PDCA サイクルに基づいて適切に管理されているか", "新技術や技術革新を経営戦略推進のために適時適切に利活用できているか"], "ans": 1, "abbr": "―", "note": "コントロール＝個別の統制が機能しているか。現場レベルの具体的な仕組みを見る。異常検知後の対処手順がこれにあたる。", "plus": "R7秋問22 で出題。ア・エはガバナンス（経営の視点）、ウはマネジメント（管理の仕組み）。3つの階層で切り分ける。"}, {"cat": "問21-22 監査", "q": "システム監査基準（令和5年）における、監査人が一定の基準に基づいて総合的に点検・評価を行う対象は、情報システムのマネジメント、コントロールと、あと一つはどれか。", "opts": ["ガバナンス", "コンプライアンス", "サイバーレジリエンス", "モニタリング"], "ans": 0, "abbr": "―", "note": "ガバナンス・マネジメント・コントロールの3つ。経営 → 管理 → 現場 の3階層で見る。", "plus": "R6春問21 で出題。3つの用語がセットで問われる。ガバナンス＝経営が方向づけているか、マネジメント＝仕組みが回っているか、コントロール＝個別統制が効いているか。"}, {"cat": "問21-22 監査", "q": "システム監査基準（令和5年）におけるフォローアップの説明として、適切なものはどれか。", "opts": ["監査対象先が、監査報告書の指摘事項及び改善提案を基に改善計画の策定を行うこと", "監査部門の責任者が、監査報告書を基に監査の実施状況と指摘事項の妥当性を確認すること", "システム監査人が、監査報告書に記載した改善提案の実施状況に関する情報を収集し、改善状況をモニタリングすること", "システム監査人が、時間の関係で調査が終了しなかった監査項目を追跡調査して報告すること"], "ans": 2, "abbr": "―", "note": "フォローアップ＝改善が実際に進んでいるかを見届けること。報告して終わりにしない。", "plus": "R6秋問22 で出題。改善計画を作るのは被監査部門（ア）。監査人は助言・勧告までで、実施を命令する権限はない。この区別が頻出。"}, {"cat": "問21-22 監査", "q": "システム監査基準における予備調査についての記述として、適切なものはどれか。", "opts": ["監査対象の実態を把握するために、必ず現地に赴いて実施する", "監査対象部門の事務手続やマニュアルなどを通じて、業務内容、業務分掌の体制などを把握する", "監査の結論を裏付けるために、十分な監査証拠を入手する", "調査の範囲は、監査対象部門だけに限定する"], "ans": 1, "abbr": "―", "note": "予備調査＝本調査の前に「どんな業務か」を知る段階。文書や資料で把握する。必ずしも現地に行く必要はない。", "plus": "R5春問21 で出題。ウは本調査の説明。監査の流れは 計画 → 予備調査 → 本調査 → 評価・結論 → 報告 → フォローアップ。"}, {"cat": "問21-22 監査", "q": "システム監査において、監査手続の適用に際して用いられる技法のうち、データの生成から入力、処理、出力、活用までのプロセス、及び組み込まれているコントロールを、書面上又は実際に追跡するものはどれか。", "opts": ["ウォークスルー法", "チェックリスト法", "突合・照合法", "ドキュメントレビュー法"], "ans": 0, "abbr": "―", "note": "データの流れを最初から最後まで追いかける。途中でどんな統制が効いているかを確認できる。", "plus": "R6秋問21 で出題。開発工程の「ウォークスルー」（机上レビュー）とは別物なので注意。監査では「追跡する技法」の意味。"}, {"cat": "問21-22 監査", "q": "システム監査における監査技法のうち、インタビュー法の記述として適切なものはどれか。", "opts": ["システム監査人が、直接、関係者に口頭で問い合わせ、回答を入手する技法", "監査対象部門に直接赴いて、自ら観察・調査する技法なので、業務時間外に実施しなければならない", "使用頻度の高い機能に特化した専用ソフトウェアによらなければならない", "監査対象部門がチェックリストを作成・利用し、その結果をシステム監査人が点検する技法"], "ans": 0, "abbr": "―", "note": "インタビュー法＝直接聞く。ただし口頭の回答だけでは証拠として弱いので、記録との突合が必要。", "plus": "R5春問22 で出題。イは現地調査法（業務時間外という限定は誤り）。ウは CAAT（専用ソフトに限らない）。エはチェックリスト法。"}, {"cat": "問21-22 監査", "q": "監査証拠の入手と評価に関する記述のうち、システム監査基準に照らして適切でないものはどれか。", "opts": ["アジャイル開発では、管理用ドキュメントとしての体裁が整っているものだけが監査証拠として利用できる", "外部委託先への監査で、委託先から入手した第三者の保証報告書に依拠できると判断すれば、現地調査を省略できる", "十分かつ適切な監査証拠を入手するための本調査の前に、予備調査を実施する", "一つの監査目的に対して、通常は複数の監査手続を組み合わせて監査を実施する"], "ans": 0, "abbr": "―", "note": "アジャイル開発では、議事録やタスクボード、コミット履歴なども監査証拠になりうる。体裁が整った文書だけに限る必要はない。", "plus": "R4春問22 で出題。「適切でないもの」を選ぶ設問。設問文の否定表現を見落とすと確実に落とす。問題文を最初に確認する癖をつける。"}, {"cat": "問21-22 監査", "q": "情報システムに対する統制を IT に係る全般統制と IT に係る業務処理統制に分けたとき、IT に係る業務処理統制に該当するものはどれか。", "opts": ["サーバ室への入退室を制限・記録するための入退室管理システム", "システム開発業務を適切に委託するために定めた選定手続", "販売管理システムにおける入力データの正当性チェック機能", "不正アクセスを防止するためのファイアウォールの運用管理"], "ans": 2, "abbr": "ITGC = IT General Controls", "note": "業務処理統制＝個別の業務処理に組み込まれた統制。入力チェック、自動計算、承認フローなど。", "plus": "R6春問22 で出題。ア・イ・エはすべて IT 全般統制（土台を支える統制）。「個別の業務処理の中か外か」で切り分ける。"}, {"cat": "問21-22 監査", "q": "システム監査人に求められる独立性のうち、外観上の独立性の説明はどれか。", "opts": ["監査対象から、第三者から見ても独立した立場にあること", "公正かつ客観的に判断する精神的な態度を保つこと", "監査に必要な専門知識と技能をもつこと", "監査の結果を文書化して保存すること"], "ans": 0, "abbr": "―", "note": "外観上＝「周りからどう見えるか」。実際に公正でも、関係者から見て身内に見えると監査の信頼性が損なわれる。", "plus": "精神上の独立性（イ）と両方が必要。自分が構築したシステムを自分で監査するのは、どちらの観点でもアウト。"}, {"cat": "問21-22 監査", "q": "システム監査人が、監査の結論を裏づけるために入手する資料や記録を何というか。", "opts": ["監査証拠", "監査調書", "監査報告書", "監査証跡"], "ans": 0, "abbr": "―", "note": "監査証拠＝集めた事実そのもの。ログ、設定画面、承認記録など。十分かつ適切であることが求められる。", "plus": "監査調書＝証拠とその判断過程を記録した文書。監査証跡＝システム内の処理をたどれる記録。監査報告書＝結論を伝える文書。4つを混同しやすい。"}, {"cat": "問21-22 監査", "q": "コンピュータを利用して大量データを検証する監査技法の総称はどれか。", "opts": ["CAAT", "ウォークスルー法", "インタビュー法", "チェックリスト法"], "ans": 0, "abbr": "CAAT = Computer Assisted Audit Techniques", "note": "全件を人の目で見るのは無理なので、ツールで抽出・突合する。サンプリングではなく全数検査ができる。", "plus": "具体的技法は テストデータ法（検証用データを流す）、監査モジュール法（本番処理に監査用の仕掛けを組み込む）、並行シミュレーション法（別プログラムで再計算して比較）。"}, {"cat": "問21-22 監査", "q": "不正や誤りを防ぐため、一人の担当者に申請から承認までを行わせない統制はどれか。", "opts": ["職務の分離", "最小権限の原則", "相互牽制の排除", "権限の集中"], "ans": 0, "abbr": "―", "note": "「頼む人」と「承認する人」を分ける。開発者が本番環境へ直接リリースできない運用も、同じ考え方。", "plus": "相互牽制ともいう。分けるべき組合せは 申請と承認、開発と運用、出納と記帳。小規模組織では上長の事後確認で補完する。"}, {"cat": "問21-22 監査", "q": "クラウドサービス事業者の内部統制を、第三者の監査人が評価して報告する仕組みはどれか。", "opts": ["SOC 報告書", "ISMS 認証", "プライバシーマーク", "CSA STAR"], "ans": 0, "abbr": "SOC = Service Organization Control", "note": "利用者が自分で監査に行けないので、事業者が第三者の監査を受けて報告書を出す。利用者はそれを使って自社の監査を通す。", "plus": "SOC1＝財務報告に関する統制。SOC2＝セキュリティ等5つの規準。SOC3＝SOC2 の一般公開版。Type1 は設計、Type2 は一定期間の運用状況まで評価。"}, {"cat": "問21-22 監査", "q": "監査手続のうち、対象の全体から一部を抽出して検証する方法はどれか。", "opts": ["サンプリング（試査）", "精査", "突合・照合法", "再実施"], "ans": 0, "abbr": "―", "note": "全部は見きれないので一部を抜いて調べる。抜き方に偏りがあると結論を誤るので、抽出方法が重要になる。", "plus": "精査＝全件を調べる。統計的サンプリング＝確率論に基づき抽出し母集団へ推定できる。非統計的サンプリング＝監査人の判断で抽出する。"}, {"cat": "問23-25 戦略", "q": "SOA の説明はどれか。", "opts": ["会計、人事、製造、購買、在庫管理、販売などの業務プロセスを一元管理し、全体最適を図る手法", "業務プロセスやシステム化要求などのニーズと、ソフトウェアパッケージの機能性がどれだけ適合しているかを分析する手法", "業務プロセスの問題点を洗い出して、目標設定・実行・チェック・修正行動のサイクルを適用し、継続的な改善を図る手法", "利用者の視点から業務システムの機能を幾つかの独立した部品に分け、業務プロセスとの対応付けや他ソフトウェアとの連携を容易にする手法"], "ans": 3, "abbr": "SOA = Service Oriented Architecture（サービス指向アーキテクチャ）", "note": "業務の機能を「サービス」という部品に分けて組み合わせる。業務が変わったら部品の組み替えで対応できる。", "plus": "★8回中2回出題（R7秋問24・R6春問23）で選択肢も同一。アは ERP、イは Fit & Gap 分析、ウは BPM。4つセットで覚える。"}, {"cat": "問23-25 戦略", "q": "バランススコアカードで使われる戦略マップの説明はどれか。", "opts": ["切り口となる二つの要素を X 軸、Y 軸として、市場における自社又は自社製品のポジションを表現したもの", "財務、顧客、内部ビジネスプロセス、学習と成長という四つの視点を基に、課題、施策、目標の因果関係を表現したもの", "市場の魅力度、自社の優位性という二つの軸から成る四象限に自社の製品や事業を分類して表現したもの", "どのような顧客層に対して、どのような経営資源を使用し、どのような製品・サービスを提供するのかを表現したもの"], "ans": 1, "abbr": "BSC = Balanced Scorecard", "note": "4つの視点を矢印でつなぎ、因果関係を描く。学習と成長 → 業務プロセス → 顧客 → 財務 の順に効いていく。", "plus": "★8回中2回出題（R7秋問26・R5春問26）で選択肢が完全に同一。確実に取れる1問。アはポジショニングマップ、ウは PPM、エはビジネスモデル。"}, {"cat": "問23-25 戦略", "q": "投資の意思決定手法の一つである PBP 法に関する記述として、適切なものはどれか。", "opts": ["キャッシュフローの時間的価値が考慮されている", "投資回収後のキャッシュフローも考慮されている", "投資金額の回収期間の長さによって投資を評価する手法である", "NPV 法や IRR 法と同様に割引率を用いる手法である"], "ans": 2, "abbr": "PBP = Pay Back Period（回収期間法）", "note": "「何年で元が取れるか」だけで判断する。計算が簡単で分かりやすいが、回収後の利益も時間価値も無視する。", "plus": "★8回中2回出題（R7秋問25・R4春問24）。NPV＝将来のお金を現在価値に割り引いて評価。IRR＝投資の利回り。ROI＝利益÷投資額。4つの指標をセットで覚える。"}, {"cat": "問23-25 戦略", "q": "情報化投資計画において、投資効果の評価指標である ROI を説明したものはどれか。", "opts": ["売上増やコスト削減などによって創出された利益額を投資額で割ったもの", "売上高投資金額比、従業員当たりの投資金額などを他社と比較したもの", "現金流入の現在価値から、現金流出の現在価値を差し引いたもの", "プロジェクトを実施しない場合の、市場での競争力を表したもの"], "ans": 0, "abbr": "ROI = Return On Investment（投資利益率）", "note": "ROI = 利益 ÷ 投資額。100万円かけて20万円の利益なら ROI は 20%。シンプルで比較しやすい。", "plus": "R5春問23 で出題。ウは NPV（正味現在価値）の説明。ROA＝総資産利益率、ROE＝自己資本利益率。似た略語を区別する。"}, {"cat": "問23-25 戦略", "q": "クラウドサービスなどの提供を迅速に実現するためのプロビジョニングの説明はどれか。", "opts": ["企画、設計、開発、導入、保守などのサービスを一貫して又は部分的に提供する", "共通する複数の企業や組織が共同でデータセンターを運用し、各種サービスを利用する", "自社でハードウェア、ネットワークなどの環境を用意し、業務パッケージなどを導入して利用する", "利用者の需要を予想し、ネットワーク設備やシステムリソースなどを計画的に調達して強化し、利用者の要求に応じたサービスを提供できるように備える"], "ans": 3, "abbr": "―", "note": "プロビジョニング＝「あらかじめ用意しておく」こと。需要を見込んで資源を準備し、要求が来たらすぐ提供できる状態にする。", "plus": "★8回中2回出題（R7春問24・R5春問17）。R5春はサーバプロビジョニングツール（構成を記述して自動構成）という切り口だった。同じ語で角度を変えて出る。"}, {"cat": "問23-25 戦略", "q": "情報システムの調達の際に作成される RFI の説明はどれか。", "opts": ["供給者候補に対して、システム化の目的や業務内容などを示し、必要な情報の提供を依頼すること", "供給者候補に対して、対象システムや調達条件などを示し、提案書の提出を依頼すること", "供給者に対して、契約内容で取り決めた内容に関して、変更を要請すること", "供給者に対して、双方の役割分担などを確認し、契約の締結を要請すること"], "ans": 0, "abbr": "RFI = Request For Information（情報提供依頼書）", "note": "「何ができますか」を聞く段階。提案を求める前に、市場にどんな選択肢があるかを知るために出す。", "plus": "R5春問25 で出題。流れは RFI → RFP（提案依頼）→ 提案書受領 → 評価・選定 → 契約。価格だけ聞くのが RFQ（見積依頼）。"}, {"cat": "問23-25 戦略", "q": "ベンダーに要件定義から運用テストまでを委託する際、“情報システム・モデル取引・契約書”に照らして、準委任型が適切とされるフェーズはどれか。", "opts": ["要件定義と運用テスト", "ソフトウェア設計とプログラミング", "システム結合とシステムテスト", "システム内部設計とシステム結合"], "ans": 0, "abbr": "―", "note": "要件定義は発注者が主体なので準委任。運用テストも発注者が主体。中間の設計・製造は成果物が明確なので請負が適する。", "plus": "R7春問25 で出題（表の穴埋め形式）。準委任＝善管注意義務（完成責任なし）。請負＝完成責任あり・契約不適合責任あり。両端が準委任、真ん中が請負と覚える。"}, {"cat": "問23-25 戦略", "q": "DX 認定制度における認定基準に含まれている事項はどれか。", "opts": ["経営ビジョン及び DX 戦略を策定して対外発信し、ビジネスモデルの革新などの成果目標も既に達成していること", "経営ビジョン及びビジネスモデルの方向性を公表するとともに、それを実現するための方策として DX 戦略を公表していること", "申請対象が、中小企業基本法で定められた中小企業であること", "デジタルガバナンス・コード3.0 の全項目に対応していること"], "ans": 1, "abbr": "―", "note": "DX 認定は「準備が整っているか」を見る制度。成果が出ていることまでは求めない。戦略を立てて公表していることが要件。", "plus": "R7春問23 で出題。アは「成果目標も達成」が過剰。ウは企業規模を問わない。エは全項目対応までは求めない。「どこまで求めるか」の程度を読む問題。"}, {"cat": "問23-25 戦略", "q": "経済産業省が取りまとめた DX 推進指標において、“IT システムに求められる要素”について経営者が確認すべき事項はどれか。", "opts": ["IT システムの全体設計や協働できるベンダーの選定などを行える人材を育成・確保できているか", "環境変化に迅速に対応し、求められるデリバリースピードに対応できる IT システムとなっているか", "データ処理において、リアルタイム性よりもビッグデータの蓄積と事後の分析が重視されているか", "データを迅速に活用するために、全体最適よりも個別最適を志向した IT システムとなっているか"], "ans": 1, "abbr": "―", "note": "DX で求められるのは「速さ」。環境変化に素早く追従できるシステムかを問う。", "plus": "R6秋問23 で出題。アは人材の話（別項目）。ウ・エは DX の方向性と逆（リアルタイム性と全体最適が求められる）。"}, {"cat": "問23-25 戦略", "q": "企業の情報システムのあるべき姿を、業務・データ・アプリケーション・技術の4つの体系で整理し、全体最適を図る手法はどれか。", "opts": ["EA", "BPR", "SOA", "ERP"], "ans": 0, "abbr": "EA = Enterprise Architecture", "note": "会社全体の情報システムの設計図。部署ごとにバラバラに作ると二重投資が起きるので、4階層で描いて揃える。", "plus": "4体系は BA（ビジネス）・DA（データ）・AA（アプリケーション）・TA（テクノロジ）。現状（As-Is）と理想（To-Be）を描き、移行計画を立てるところまで含む。"}, {"cat": "問23-25 戦略", "q": "BPR の説明はどれか。", "opts": ["業務プロセスを抜本的に再設計し、コスト・品質・スピードを劇的に改善する", "業務プロセスを継続的に少しずつ改善していく", "業務プロセスを図式化して標準的な記法で表す", "業務システムの機能をサービスとして部品化する"], "ans": 0, "abbr": "BPR = Business Process Re-engineering", "note": "「今のやり方を改善する」ではなく「やり方ごと作り直す」。不連続な変革を狙う。", "plus": "イは BPM／カイゼン（継続的改善）。ウは BPMN（記法）。エは SOA。似た頭文字が並ぶので、R＝Re-engineering＝作り直し、と結びつける。"}, {"cat": "問23-25 戦略", "q": "システムのライフサイクル全体（導入から廃棄まで）にかかる総費用を表す指標はどれか。", "opts": ["TCO", "ROI", "NPV", "ABC"], "ans": 0, "abbr": "TCO = Total Cost of Ownership（総所有コスト）", "note": "買ったときの値段だけでなく、運用・保守・電気代・撤去費まで全部足したもの。運用が7〜8割を占めることが多い。", "plus": "初期費用の安さだけで選ぶと、運用で逆転することがある。オンプレとクラウドの比較で必ず出てくる考え方。"}, {"cat": "問23-25 戦略", "q": "共通フレーム（SLCP-JCF）の目的として、適切なものはどれか。", "opts": ["取得者と供給者が、ソフトウェアライフサイクルの作業内容について共通の言葉で話せるようにする", "ソフトウェア開発の工数を見積もるための標準値を提供する", "プロジェクトマネジメントの知識体系を提供する", "情報セキュリティマネジメントの要求事項を定める"], "ans": 0, "abbr": "SLCP-JCF = Software Life Cycle Process - Japan Common Frame", "note": "発注側と受注側で「要件定義」という言葉の中身がずれると揉める。用語と作業範囲を共通化するための枠組み。", "plus": "イは見積手法、ウは PMBOK、エは ISO/IEC 27001。共通フレームは「ものさし」であって、やり方を強制するものではない。"}, {"cat": "問23-25 戦略", "q": "情報システム部門が提供するサービスの水準を、可用性・性能などの数値で合意した文書はどれか。", "opts": ["SLA", "OLA", "UC", "RFP"], "ans": 0, "abbr": "SLA = Service Level Agreement", "note": "「月間稼働率99.9%」のような約束。守れなかったときの措置（減額など）までセットで決める。", "plus": "OLA＝社内部門間の取り決め。UC（Underpinning Contract）＝外部委託先との契約。SLA を裏で支える2つ。"}, {"cat": "問23-25 戦略", "q": "システム化計画において、複数の候補から価格・技術・体制などを総合的に評価して発注先を選ぶ方式はどれか。", "opts": ["総合評価方式", "最低価格落札方式", "随意契約", "指名競争入札"], "ans": 0, "abbr": "―", "note": "価格点と技術点に重み付けをして点数化する。値段だけで選ぶ最低価格落札方式の反対で、品質も見る。", "plus": "IT 調達では、特定の製品を指名せず「機能要求」で書くのが原則。特定ベンダーに有利な仕様は公平性を損なう。"}, {"cat": "問23-25 戦略", "q": "シェアードサービスの説明はどれか。", "opts": ["経理・人事などの間接業務をグループ内で1か所に集約して共用する", "業務を外部の専門企業に委託する", "複数企業が共同でデータセンターを運用する", "自社の業務システムを他社へ提供して収益を得る"], "ans": 0, "abbr": "―", "note": "グループ各社に散らばった同じ業務を1か所にまとめる。重複をなくしてコストを下げる。社内に残すのが特徴。", "plus": "イはアウトソーシング（外へ出す）、ウはコロケーション／共同利用型。「社内に集約」か「外部へ委託」かが分かれ目。"}, {"cat": "問26-28 経営", "q": "市場成長率と相対的市場シェアから、市場と企業との関係を分析し、自社製品や事業についての最適な資源配分方針を求めるための手法はどれか。", "opts": ["3C 分析", "BSC", "PPM", "SWOT 分析"], "ans": 2, "abbr": "PPM = Product Portfolio Management", "note": "縦軸が市場成長率、横軸が相対的市場占有率。4象限は 花形・金のなる木・問題児・負け犬。", "plus": "★8回中2回出題（R7春問26・R4春問26）。R4春は「投資用の資金源として位置付けられる事業」＝金のなる木（成長率低・占有率高）を問う形だった。"}, {"cat": "問26-28 経営", "q": "PPM において、投資用の資金源として位置付けられる事業はどれか。", "opts": ["市場成長率が高く、相対的市場占有率が高い事業", "市場成長率が高く、相対的市場占有率が低い事業", "市場成長率が低く、相対的市場占有率が高い事業", "市場成長率が低く、相対的市場占有率が低い事業"], "ans": 2, "abbr": "―", "note": "金のなる木＝成長が止まった市場でシェアが高い。新規投資が少なくて済み、安定して稼げる。ここで得た資金を問題児に投じる。", "plus": "R4春問26 で出題。花形（ア）＝成長もシェアも高いが投資も必要。問題児（イ）＝投資先。負け犬（エ）＝撤退候補。"}, {"cat": "問26-28 経営", "q": "図のアンゾフの成長マトリクスのうち、市場浸透戦略の例として適切なものはどれか。", "opts": ["ある商品が高いシェアを確保したため、最新技術を取り入れた上位機種を既存ユーザー向けに販売する", "ある地域において特別価格で販売することで、商品の知名度を上げ、その地域の多くの住民に販売する", "ある地方で長年販売してきた商品を、今年から他の地方でも販売する", "販売実績がないある国の商習慣に合う製品を一から開発し、その国で販売する"], "ans": 1, "abbr": "―", "note": "市場浸透＝既存市場 × 既存製品。同じ商品を同じ市場でもっと売る。値下げや販促で販売量を増やす。", "plus": "R7秋問27 で出題。アは新製品開発（既存市場×新製品）、ウは新市場開拓（新市場×既存製品）、エは多角化（新市場×新製品）。"}, {"cat": "問26-28 経営", "q": "企業における研究、開発、事業化、産業化へとステージが移行する過程で、事業化から産業化に移行するときの、競合製品との競争過程にある障壁を何と呼ぶか。", "opts": ["キャズム", "死の谷", "ダーウィンの海", "魔の川"], "ans": 2, "abbr": "―", "note": "順番は 魔の川（研究→開発）→ 死の谷（開発→事業化）→ ダーウィンの海（事業化→産業化）。最後の関門が競合との生き残り競争。", "plus": "R6秋問27 で出題。キャズムは別の軸で、普及過程のアーリーアダプタとアーリーマジョリティの間の溝。4つを並べる典型問題。"}, {"cat": "問26-28 経営", "q": "コ・クリエーション戦略の特徴はどれか。", "opts": ["営業部門と製造部門が協働し、特定の商品に限定して自前主義にこだわる", "顧客が自らのアイデアを商品の仕様に落とし込み、企業に製造してもらう", "顧客や企業ネットワークの力を活用し、商品だけでなく顧客の経験までを含めて差別化可能な価値を創造する", "自社に不足する経営資源を M&A によって強化し、新たな価値を創造する"], "ans": 2, "abbr": "―", "note": "co-creation＝共創。企業が一方的に作るのではなく、顧客や外部と一緒に価値を作る。体験まで含めて設計する。", "plus": "R6秋問26 で出題。イは受注生産／マスカスタマイゼーションに近い。エは M&A。オープンイノベーションとも関連する。"}, {"cat": "問26-28 経営", "q": "EMS（Electronics Manufacturing Services）の説明として、適切なものはどれか。", "opts": ["相手先ブランドで販売する電子機器の設計だけを受託し、製造は相手先で行う", "外部から調達した電子機器に付加価値を加えて、自社ブランドで販売する", "自社ブランドで販売する電子機器のソフトウェア開発だけを外部に委託する", "生産設備をもつ企業が、他社からの委託を受けて電子機器を製造する"], "ans": 3, "abbr": "EMS = Electronics Manufacturing Services", "note": "製造を専門に請け負う。自社ブランドは持たず、複数の発注元の製品を作る。規模の経済でコストを下げる。", "plus": "R6春問24 で出題。ファブレス＝工場を持たず設計に専念（Apple など）。ファウンドリ＝半導体の製造受託。EMS は電子機器版のファウンドリ。"}, {"cat": "問26-28 経営", "q": "半導体産業において、ファブレス企業と比較したファウンドリ企業のビジネスモデルの特徴として、適切なものはどれか。", "opts": ["工場での生産をアウトソーシングして、生産設備への投資を抑える", "自社製品の設計、マーケティングに注力し、新市場を開拓する", "自社製品の販売に注力し、売上げを拡大する", "複数の企業から生産だけを専門に請け負い、多くの製品を低コストで生産する"], "ans": 3, "abbr": "―", "note": "ファウンドリ＝製造専門。設備投資は重いが、複数社から受注して稼働率を上げる。TSMC が代表。", "plus": "R4春問27 で出題。ア・イはファブレス（設計専門・工場なし）。両者は対で出題される。"}, {"cat": "問26-28 経営", "q": "アグリゲーションサービスに関する記述として、適切なものはどれか。", "opts": ["小売販売の会社が、店舗や EC サイトなどあらゆる顧客接点をシームレスに統合する", "物品などの売買に際し、信頼のおける中立的な第三者が契約当事者の間に入り、代金決済等取引の安全性を確保する", "分散的に存在する事業者、個人や機能への一括的なアクセスを顧客に提供し、比較、まとめ、統一的な制御、最適な組合せなどワンストップでのサービス提供を可能にする", "本部と契約した加盟店が、本部に対価を支払い、販売促進、確立したサービスや商品などを使う権利を受け取る"], "ans": 2, "abbr": "―", "note": "散らばっているものを1か所に集めて、まとめて扱えるようにする。価格比較サイトや口座一括管理サービスが例。", "plus": "R5春問28 で出題。アはオムニチャネル、イはエスクロー、エはフランチャイズ。4つのビジネスモデル用語をまとめて覚える。"}, {"cat": "問26-28 経営", "q": "XBRL で主要な取扱いの対象とされている情報はどれか。", "opts": ["医療機関のカルテ情報", "企業の顧客情報", "企業の財務情報", "自治体の住民情報"], "ans": 2, "abbr": "XBRL = eXtensible Business Reporting Language", "note": "財務報告を XML で記述する国際標準。決算書を機械が読めるので、分析や開示が効率化する。", "plus": "R4春問28 で出題。EDINET（金融庁の開示システム）で採用されている。「Business Reporting」＝事業報告＝財務情報、と語から導ける。"}, {"cat": "問26-28 経営", "q": "生産事業所のシステムを、計画層・実行層・制御層の三つに分けたとき、MES が運用される層はどれか。", "opts": ["計画層", "実行層", "制御層", "計画層・実行層・制御層の全て"], "ans": 1, "abbr": "MES = Manufacturing Execution System（製造実行システム）", "note": "名前のとおり「実行」の層。生産計画（ERP）と現場の機械制御（SCADA/PLC）の間に立ち、作業指示や工程管理を行う。", "plus": "R7秋問28 で出題。計画層＝ERP／生産管理、実行層＝MES、制御層＝PLC・SCADA。3層の対応を覚える。"}, {"cat": "問26-28 経営", "q": "スマートファクトリーで使用される AI を用いたマシンビジョンの目的として、適切なものはどれか。", "opts": ["クラウドに蓄積した入出荷データを用いて AI が需要予測し、生産数を最適化する", "作業者が装着した VR ゴーグルに AI が作業状況に応じたガイドを表示する", "設計変更内容を AI によって整理し、製造現場に正確に伝達する", "人間の目視検査を AI が代替し、検査効率を向上させる"], "ans": 3, "abbr": "―", "note": "マシンビジョン＝機械の目。カメラで撮って AI が良否を判定する。人が見るより速く、疲れない。", "plus": "R7春問28 で出題。「ビジョン＝視覚」から、目で見る作業の置き換えと判断できる。他の選択肢は AI の別用途。"}, {"cat": "問26-28 経営", "q": "他社の優れた業務プロセスを指標として比較し、自社の改善に生かす手法はどれか。", "opts": ["ベンチマーキング", "ベストプラクティス", "SWOT 分析", "バリューチェーン分析"], "ans": 0, "abbr": "―", "note": "比べる相手は競合に限らず、他業種の優良企業でもよい。差を数値で把握し、改善目標にする。", "plus": "ベストプラクティスは「最も良いやり方」そのものを指す語。ベンチマーキングはそれと比べる活動。バリューチェーン分析は自社の活動を主活動と支援活動に分けて見る。"}, {"cat": "問26-28 経営", "q": "顧客との関係を長期的に維持・強化し、収益の最大化を図る考え方・システムはどれか。", "opts": ["CRM", "SCM", "SFA", "ERP"], "ans": 0, "abbr": "CRM = Customer Relationship Management", "note": "新規獲得より既存顧客を大事にするほうが安い、という発想。購買履歴を分析して個別に対応する。", "plus": "SFA（営業支援）は CRM の一部。SCM＝調達から販売までの流れの最適化。ERP＝基幹業務の一元管理。4つの守備範囲を区別する。"}, {"cat": "問26-28 経営", "q": "業界の競争要因を5つの力で分析する手法はどれか。", "opts": ["ファイブフォース分析", "SWOT 分析", "PEST 分析", "VRIO 分析"], "ans": 0, "abbr": "―", "note": "新規参入・代替品・買い手・売り手・競合の5つ。業界そのものが儲かる構造かを見る。", "plus": "SWOT＝自社の強み弱みと外部の機会脅威。PEST＝政治・経済・社会・技術のマクロ環境。VRIO＝経営資源の競争優位性を4観点で評価。分析の対象が違う。"}, {"cat": "問26-28 経営", "q": "IoT を支える技術のうち、必要な時だけデバイスの電源を ON にして通信を行い、省電力化を図る技術はどれか。", "opts": ["間欠動作", "エネルギーハーベスティング", "PoE", "LPWA"], "ans": 0, "abbr": "―", "note": "常時起動せず、決まった間隔で起きて送信し、また眠る。電池の持ちが大きく変わる。", "plus": "エネルギーハーベスティング＝環境中の微小エネルギーを集めて発電。PoE＝LAN ケーブルで給電。LPWA＝低消費電力で広域をカバーする通信方式。IoT の省電力4点セット。"}, {"cat": "問26-28 経営", "q": "製造業において、生産設備や製品をネットワークに接続し、データを活用して効率化する取り組みを指す言葉はどれか。", "opts": ["インダストリー4.0", "ソサエティ5.0", "スマートシティ", "MaaS"], "ans": 0, "abbr": "―", "note": "ドイツ発の国家戦略。蒸気→電力→コンピュータ に続く第4次産業革命。IoT と AI が中核技術。", "plus": "ソサエティ5.0 は日本政府の提唱で、社会全体のデジタル化（狩猟・農耕・工業・情報に続く5番目）。対象が産業か社会全体かで区別する。"}, {"cat": "問29-30 法務", "q": "A 社は、B 社と著作物の権利に関する特段の取決めをせず、A 社の要求仕様に基づいて販売管理システムのプログラム作成を B 社に委託した。この場合のプログラム著作権の原始的帰属に関する記述のうち、適切なものはどれか。", "opts": ["A 社と B 社が話し合って帰属先を決定する", "A 社と B 社の共有帰属となる", "A 社に帰属する", "B 社に帰属する"], "ans": 3, "abbr": "―", "note": "著作権は「実際に作った者」に発生する。特約がなければ受託者（B社）のもの。発注して金を払っただけでは移らない。", "plus": "R4春問30 で出題。だから委託契約では「著作権を委託元へ移転する」条項を必ず入れる。R7秋問17 の著作者人格権の不行使条項も同じ文脈。"}, {"cat": "問29-30 法務", "q": "委託元への著作権の移転に関する条項を含むソフトウェア開発委託契約書に、“委託先は著作者人格権を行使しない”という記載があった。これはどのような問題の発生を防ぐためのものか。", "opts": ["開発者が、技術者倫理に関しての責任を負わなくなることを防ぐ", "開発者を、委託元が後で雇用できなくなることを防ぐ", "不具合が発見された場合に、委託先が金銭的補償を負わなくなることを防ぐ", "納品されたソフトウェアを委託先の了解なく委託元で修正できなくなること、又は他の会社に修正を依頼できなくなることを防ぐ"], "ans": 3, "abbr": "―", "note": "著作者人格権は譲渡できない権利で、同一性保持権（勝手に改変されない権利）を含む。これを行使されると、委託元が自由に修正できない。", "plus": "R7秋問17 で出題。著作権（財産権）は譲渡できるが、著作者人格権は一身専属で譲渡不可。だから「行使しない」と約束させる。"}, {"cat": "問29-30 法務", "q": "意匠法において、保護の対象となり得るものはどれか。", "opts": ["独自の GUI", "独自のアルゴリズム", "独自の通信プロトコル", "独自のビジネスモデル"], "ans": 0, "abbr": "―", "note": "意匠法は「物品のデザイン」を守る。2020年の改正で画像デザイン（GUI）も対象に加わった。", "plus": "R7秋問30 で出題。アルゴリズムや通信プロトコルは技術的思想なので特許の領域。ビジネスモデルは単体では保護されず、ITと結びつけばビジネスモデル特許の可能性がある。"}, {"cat": "問29-30 法務", "q": "労働者派遣法において、派遣元事業主の講ずべき措置等として定められているものはどれか。", "opts": ["派遣先管理台帳の作成", "派遣先責任者の選任", "派遣労働者を指揮命令する者への派遣契約内容の周知", "労働者の教育訓練の機会の確保など、福祉の増進"], "ans": 3, "abbr": "―", "note": "派遣元＝雇い主なので、教育訓練やキャリア形成の責任を負う。ア・イ・ウはすべて派遣先の義務。", "plus": "R5春問30 で出題。派遣元＝雇用主（給与・教育・社会保険）、派遣先＝指揮命令（台帳・責任者・就業環境）。どちらの義務かを切り分ける。"}, {"cat": "問29-30 法務", "q": "プログラムの著作権について、著作権法上の保護対象となるものはどれか。", "opts": ["プログラムの表現（ソースコード・オブジェクトコード）", "アルゴリズム", "プログラム言語", "規約（プロトコル）"], "ans": 0, "abbr": "―", "note": "守られるのは「書き方」であって、アイデアは守られない。著作権法10条3項で、プログラム言語・規約・解法は保護対象外と明記されている。", "plus": "アイデアを守りたいなら特許。知的財産権の整理 ── 著作権（表現・申請不要・死後70年）、特許（発明・出願必要・20年）、実用新案、意匠、商標。"}, {"cat": "問29-30 法務", "q": "不正アクセス禁止法で禁止されている行為に該当しないものはどれか。", "opts": ["他人の ID・パスワードを無断で使用してログインする", "他人の ID・パスワードを不正に取得する", "他人の ID・パスワードを第三者に提供する", "自分が管理するサーバに対して脆弱性診断を行う"], "ans": 3, "abbr": "―", "note": "自分の管理下にあるシステムへの診断は、不正アクセスにあたらない。他人のシステムに対して無断で行えば違反になる。", "plus": "禁止されるのは 不正アクセス行為・識別符号の不正取得・不正保管・助長行為（提供）・入力を不正に要求する行為（フィッシング）。"}, {"cat": "問29-30 法務", "q": "企業の営業秘密が不正競争防止法で保護されるための3要件に含まれないものはどれか。", "opts": ["秘密管理性", "有用性", "非公知性", "新規性"], "ans": 3, "abbr": "―", "note": "3要件は 秘密管理性（鍵をかけて管理）・有用性（事業に役立つ）・非公知性（知られていない）。新規性は特許の要件。", "plus": "実務では「秘密管理性」が争点になりやすい。マル秘表示、アクセス制限、誓約書などで「秘密として管理していた」ことを示す必要がある。"}, {"cat": "問29-30 法務", "q": "ソフトウェアの使用許諾において、改変・再配布を認める代わりに、派生物にも同じライセンスの適用を求める考え方はどれか。", "opts": ["コピーレフト", "パブリックドメイン", "シェアウェア", "プロプライエタリ"], "ans": 0, "abbr": "―", "note": "GPL が代表例。自社製品に GPL のコードを混ぜると、自社コードも公開義務が生じうる。OSS 利用時の最重要注意点。", "plus": "強いコピーレフト＝GPL。弱い＝LGPL・MPL（改変部分のみ）。非コピーレフト＝MIT・BSD・Apache（制限がゆるい）。利用前に必ず種別を確認する。"}, {"cat": "問29-30 法務", "q": "原価計算基準に従い、製造原価の経費に算入する費用はどれか。", "opts": ["製品を生産している機械装置の修繕費用", "台風で被害を受けた製品倉庫の修繕費用", "賃貸目的で購入した倉庫の管理費用", "本社社屋建設のために借り入れた資金の支払利息"], "ans": 0, "abbr": "―", "note": "製造原価に入るのは「製品を作るために直接かかった費用」。生産設備の修繕費はこれにあたる。", "plus": "R5春問29 で出題。イは特別損失（異常な事態）、ウは営業外費用、エは営業外費用（支払利息）。製造原価・販管費・営業外・特別の4区分で切り分ける。"}, {"cat": "問29-30 法務", "q": "企業の一定期間における現金の増減を、営業・投資・財務の3区分で表す財務諸表はどれか。", "opts": ["キャッシュフロー計算書", "貸借対照表", "損益計算書", "株主資本等変動計算書"], "ans": 0, "abbr": "C/F = Cash Flow statement", "note": "利益が出ていても現金がなければ倒産する（黒字倒産）。それを見抜くための表。", "plus": "健全な形は 営業CF プラス・投資CF マイナス・財務CF マイナス（稼いで投資して借金を返す）。B/S は一時点の財産、P/L は一期間の損益。"}, {"cat": "問29-30 法務", "q": "損益分岐点売上高を求める式はどれか。", "opts": ["固定費 ÷ 限界利益率", "固定費 ÷ 変動費率", "変動費 ÷ 限界利益率", "売上高 − 変動費"], "ans": 0, "abbr": "―", "note": "限界利益率 = (売上 − 変動費) ÷ 売上。固定費をこの率で割ると、固定費を回収できる売上高が出る。", "plus": "固定費が大きいほど、売上の増減で利益が大きく振れる（経営レバレッジが高い）。R7春問29・R7秋問29 で計算問題として出題。"}, {"cat": "問29-30 法務", "q": "在庫品目を金額の大きい順に並べ、A・B・Cの3グループに分けて管理の重点を変える手法はどれか。", "opts": ["ABC 分析", "PPM", "SWOT 分析", "回帰分析"], "ans": 0, "abbr": "―", "note": "パレートの法則（上位2割が全体の8割）の応用。A グループだけ厳密に管理すれば効率がよい。", "plus": "図にするとパレート図（棒グラフ＋累積折れ線）。QC七つ道具は パレート図・特性要因図・ヒストグラム・散布図・管理図・チェックシート・層別。"}, {"cat": "問29-30 法務", "q": "個人情報保護法において、要配慮個人情報に該当しないものはどれか。", "opts": ["人種", "信条", "病歴", "メールアドレス"], "ans": 3, "abbr": "―", "note": "要配慮個人情報＝差別や偏見につながりうる情報。人種・信条・社会的身分・病歴・犯罪歴・犯罪被害の事実など。取得にも本人同意が要る。", "plus": "2022年改正で、漏えい時の個人情報保護委員会への報告と本人通知が義務化された。匿名加工情報・仮名加工情報にすれば一定条件下で利活用できる。"}, {"cat": "問29-30 法務", "q": "請負契約と準委任契約の違いとして、適切なものはどれか。", "opts": ["請負は仕事の完成を目的とし、準委任は事務の処理を目的とする", "請負は指揮命令権が発注者にあり、準委任は受注者にある", "請負は報酬が時間単位で、準委任は成果物単位である", "請負は契約不適合責任を負わず、準委任は負う"], "ans": 0, "abbr": "―", "note": "請負＝完成させる義務。準委任＝善管注意義務（きちんとやる義務）で、完成は約束しない。契約不適合責任は請負が負う。", "plus": "指揮命令権はどちらも受注者側にある（発注者が直接指示すると偽装請負）。発注者に指揮命令権があるのは労働者派遣契約だけ。"}];

const LB = ["ア","イ","ウ","エ"];
const KEY = "a1-v2";
let filter=null, wrongOnly=false, todoOnly=false, showAll=false;
let order = DATA.map((_,i)=>i);
let res = JSON.parse(localStorage.getItem(KEY) || "{}");
// 選択肢の並びを問題ごとに固定（リロードしても同じ）
const perm = DATA.map((d,i)=>{
  let a=[0,1,2,3], s=i*2654435761 % 2147483647;
  for(let k=3;k>0;k--){ s=(s*1103515245+12345)%2147483648; const j=s%(k+1); [a[k],a[j]]=[a[j],a[k]]; }
  return a;
});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(res)); }catch(e){} }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function chips(){
  const el=document.getElementById("chips"); el.innerHTML="";
  const mk=(l,v)=>{const b=document.createElement("button");b.className="chip";b.textContent=l;
    b.setAttribute("aria-pressed",filter===v);b.onclick=()=>{filter=v;chips();render();};el.appendChild(b);};
  mk("すべて",null); CATS.forEach(c=>mk(c,c));
}
function render(){
  const list=document.getElementById("list"); list.innerHTML=""; let n=0;
  order.forEach(i=>{
    const d=DATA[i];
    if(filter && d.cat!==filter) return;
    if(wrongOnly && res[i]!==false) return;
    if(todoOnly && (i in res)) return;
    n++;
    const idx=perm[i], answered=(i in res);
    const open = answered || showAll;
    const card=document.createElement("div");
    card.className="card"+(answered&&res[i]?" ok":"");
    const mk = !answered ? "" :
      (res[i] ? '<span class="mk" style="color:#10b981">正解</span>'
              : '<span class="mk" style="color:#ef4444">不正解</span>');
    card.innerHTML =
      '<div class="qh"><span class="qn">Q'+String(i+1).padStart(3,"0")+'</span>'+
      '<span class="qc">'+esc(d.cat)+'</span>'+mk+'</div>'+
      '<p class="qt">'+esc(d.q)+'</p><div class="opts"></div>'+
      '<div class="ans" hidden>'+
        (d.abbr!=="―" ? '<p class="abbr">'+esc(d.abbr)+'</p>' : '')+
        '<div class="expl"><div class="el">かんたん解説</div><p class="eb">'+esc(d.note)+'</p></div>'+
        (d.plus ? '<div class="plus"><div class="pl">あわせて覚える</div><p class="pb">'+esc(d.plus)+'</p></div>' : '')+
      '</div>';
    const opts=card.querySelector(".opts"), ans=card.querySelector(".ans");
    idx.forEach((oi,pos)=>{
      const b=document.createElement("button"); b.className="opt"; b.disabled=open;
      b.innerHTML='<span class="lb">'+LB[pos]+'</span><span>'+esc(d.opts[oi])+'</span>';
      if(open && oi===d.ans) b.classList.add("correct");
      b.onclick=()=>{
        if(b.disabled) return;
        const hit=(oi===d.ans);
        card.querySelectorAll(".opt").forEach((x,p)=>{x.disabled=true; if(idx[p]===d.ans)x.classList.add("correct");});
        if(!hit) b.classList.add("wrong");
        ans.hidden=false; if(hit) card.classList.add("ok");
        res[i]=hit; save();
        const h=card.querySelector(".qh"); const o=h.querySelector(".mk"); if(o)o.remove();
        const s=document.createElement("span"); s.className="mk";
        s.style.color=hit?"#10b981":"#ef4444"; s.textContent=hit?"正解":"不正解"; h.appendChild(s);
        score();
      };
      opts.appendChild(b);
    });
    if(open) ans.hidden=false;
    list.appendChild(card);
  });
  document.getElementById("count").textContent="表示 "+n+" / 全 "+DATA.length+" 問";
  score();
}
function score(){
  const k=Object.keys(res), ok=k.filter(x=>res[x]).length;
  const pct=k.length?Math.round(ok/k.length*100):0;
  document.getElementById("score").textContent=
    "正解 "+ok+" / "+k.length+"（"+pct+"%）　未解答 "+(DATA.length-k.length);
}
document.getElementById("showAns").onclick=e=>{
  showAll=!showAll;
  e.target.textContent = showAll ? "答えを隠す" : "答えを表示";
  e.target.classList.toggle("on",showAll);
  render();
};
document.getElementById("wrongOnly").onclick=e=>{wrongOnly=!wrongOnly;todoOnly=false;
  e.target.classList.toggle("on",wrongOnly);document.getElementById("todo").classList.remove("on");render();};
document.getElementById("todo").onclick=e=>{todoOnly=!todoOnly;wrongOnly=false;
  e.target.classList.toggle("on",todoOnly);document.getElementById("wrongOnly").classList.remove("on");render();};
document.getElementById("shuffle").onclick=()=>{
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  render(); window.scrollTo(0,0);};
document.getElementById("reset").onclick=()=>{res={};save();render();};
chips(); render();
</script>
</body>
</html>
